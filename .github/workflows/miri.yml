name: Miri

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 2'

concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MIRIFLAGS: -Zmiri-strict-provenance

jobs:
  miri:
    name: Miri (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [bcinr-mfw-ir, bcinr-powl, bcinr-pddl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri on production composition crates
        run: cargo miri test -p ${{ matrix.package }} --all-features
