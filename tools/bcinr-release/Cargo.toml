[package]
name = "bcinr-release"
version = "26.7.28"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/bcinr"
description = "Fail-closed release admission and evidence aggregation for BCINR"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
