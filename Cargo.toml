[workspace]
members = ["bcinr", "bcinr-core", "bcinr-bench", "crates/bcinr-api", "crates/bcinr-logic", "crates/wasm4games", "tools/bcinr-reporter", "tools/bcinr-contract-gate", "tools/bcinr-bench-auditor", "tools/bcinr-cheat-scanner", "tools/rust_audit", "crates/encode_unicode_patch"]
# wasm4games-wasm4pm is the online-only bridge to the external wasm4pm / wasm4pm-compat
# repos. It is excluded so the offline workspace build never resolves git dependencies.
exclude = ["crates/wasm4games-wasm4pm"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[patch.crates-io]
encode_unicode = { path = "crates/encode_unicode_patch" }
