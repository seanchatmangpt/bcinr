[package]
name = "bcinr-cmca"
version = "26.9.28"
edition = "2021"
description = "CMCA-RDF deterministic substrate crate"
license = "MIT OR Apache-2.0"
rust-version = "1.70"
repository = "https://github.com/seanchatmangpt/bcinr"
keywords = ["cmca", "rdf", "deterministic", "algorithms"]
categories = ["algorithms"]
readme = "../../README.md"
# Published so bcinr-powl / bcinr-pddl (mfw-planner) can resolve it from
# crates.io. The allocator authority subsystem (CMCA-102 / CMCA-114, see
# lib.rs "INTEGRATION NOTE (v26.7.24)") stays #[deprecated] pending
# Hoare-logic verification; that status ships with the crate.
publish = true

[dependencies]
bcinr-logic = { path = "../bcinr-logic", version = "26.9.28" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chicago-tdd-tools = { version = "26.7.1", features = ["ocel-generation"] }
trybuild = "1.0"
proptest = "1.2.0"

[features]
default = []
alloc = []
std = ["bcinr-logic/std", "alloc"]
mutant_1 = []
mutant_2 = []
mutant_3 = []
mutant_4 = []
mutant_5 = []
mutant_6 = []
mutant_7 = []
mutant_8 = []
mutant_9 = []
mutant_10 = []
mutant_11 = []
[lib]
crate-type = ["rlib"]

# These tests import `cascade` / `escort` / `reference_escort`, which are
# `alloc`-gated in lib.rs. Declared with `required-features` rather than an
# inner `#![cfg(feature = "alloc")]` so a default build reports the target as
# skipped instead of passing as an empty binary.

[[test]]
name = "cascade_residual_classification"
required-features = ["alloc"]

[[test]]
name = "cmca_h1_refusal_correspondence"
required-features = ["alloc"]

[[test]]
name = "cmca_h_lean_correspondence"
required-features = ["alloc"]

[[test]]
name = "lean_correspondence"
required-features = ["alloc"]

[[test]]
name = "lean_correspondence_h"
required-features = ["alloc"]

[[test]]
name = "power_error_bound"
required-features = ["alloc"]

[[test]]
name = "runtime_semantic_classification"
required-features = ["alloc"]
