[package]
name = "bcinr"
version = "26.7.25"
edition = "2021"
description = "BranchlessCInRust: Academic-grade branchless algorithm library"
repository = "https://github.com/seanchatmangpt/bcinr"
license = "MIT OR Apache-2.0"
readme = "../README.md"
rust-version = "1.70"
keywords = ["branchless", "simd", "performance"]
categories = ["algorithms", "no-std"]

[dependencies]
bcinr-api = { path = "../crates/bcinr-api", version = "26.7.25" }
bcinr-core = { path = "../bcinr-core", version = "26.7.25" }
bcinr-logic = { path = "../crates/bcinr-logic", version = "26.7.25" }

[dev-dependencies]
tempfile = "3.27"
