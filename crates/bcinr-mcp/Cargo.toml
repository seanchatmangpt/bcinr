[package]
name = "bcinr-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bcinr-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.0.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bcinr-pddl = { path = "../bcinr-pddl" }
bcinr-powl = { path = "../bcinr-powl" }
bcinr-logic = { path = "../bcinr-logic" }
bcinr-api = { path = "../bcinr-api" }
bcinr-powl-receipt = { path = "../bcinr-powl-receipt" }
blake3 = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
