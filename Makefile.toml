[config]
# Standardized Rust workspace configuration
skip_core_tasks = false
default_to_workspace = true

[env]
CARGO_INCREMENTAL = "0"
RUSTFLAGS = "-D warnings"

[tasks.check]
category = "Build"
description = "Verify workspace compiles"
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--all-features"]

[tasks.build]
category = "Build"
description = "Build the workspace in release mode"
command = "cargo"
args = ["build", "--workspace", "--release", "--all-features"]

[tasks.test]
category = "Test"
description = "Run all workspace tests"
command = "cargo"
args = ["test", "--workspace", "--all-features", "--all-targets"]

[tasks.bench]
category = "Performance"
description = "Execute workspace-wide benchmarks"
command = "cargo"
args = ["bench", "--all-features"]

[tasks.bench-report]
category = "Performance"
description = "Generate performance report"
dependencies = ["bench"]
script = [
    "echo \"| Algorithm Family | Primitive | Latency (avg) |\"",
    "echo \"|---|---|---|\"",
    "find target/criterion -name estimates.json | xargs grep -h '\"mean\":' | jq -r '\"| \\(.family) | \\(.primitive) | \\(.mean.point_estimate) \\(.mean.unit) |\"' || echo 'Use jq for structured report output'"
]

[tasks.clippy]
category = "Lint"
description = "Run clippy with strict pedantic lints"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.fmt]
category = "Lint"
description = "Check formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.audit]
category = "Security"
description = "Run cargo audit for vulnerabilities"
command = "cargo"
args = ["audit"]

[tasks.deny]
category = "Security"
description = "Check licenses and supply chain"
command = "cargo"
args = ["deny", "check"]

[tasks.docs]
category = "Documentation"
description = "Build all documentation"
command = "cargo"
args = ["doc", "--workspace", "--all-features", "--no-deps", "--document-private-items"]

[tasks.clean]
category = "Cleanup"
description = "Clean artifacts and criterion results"
script = [
    "cargo clean",
    "rm -rf target/criterion"
]

[tasks.lint-anti-llm]
category = "Lint"
description = "Scan bcinr-mcp for LLM-generated stubs, hedge comments, and unverified claims"
workspace = false
command = "cargo"
args = ["run", "--manifest-path", "/Users/sac/anti-llm-cheat-lsp/Cargo.toml", "--quiet", "--", "scan", "--dir", "crates/bcinr-mcp/src"]

# Wire anti-llm scan into clippy so CI always catches stub code in the MCP layer.
[tasks.clippy]
category = "Lint"
description = "Run clippy with strict pedantic lints (+ anti-LLM stub scan)"
dependencies = ["lint-anti-llm"]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.scan-cheats]
category = "Lint"
description = "Scan for algorithmic cheats and anti-patterns"
workspace = false
command = "cargo"
args = ["run", "--manifest-path", "tools/bcinr-cheat-scanner/Cargo.toml", "--release", "--quiet"]

[tasks.contract-gate]
category = "Lint"
description = "Validate branchless contract compliance"
workspace = false
command = "cargo"
args = ["run", "--manifest-path", "tools/bcinr-contract-gate/Cargo.toml", "--release", "--quiet"]

[tasks.ggen]
category = "Test"
description = "Run counterfactual and falsification test suite"
workspace = false
command = "cargo"
args = ["run", "--manifest-path", "tools/ggen/Cargo.toml", "--release", "--quiet"]

# ---------------------------------------------------------------------------
# GGEN Chess Factory — manufacturing cell tasks (TTL -> ggen -> Rust).
# Edit ontology/chess.ttl, never hand-edit generated source.
# ---------------------------------------------------------------------------

[tasks.chess-factory-sync]
category = "Factory"
description = "Manufacture chess-factory stations from law (ggen sync over chess.ttl)"
workspace = false
cwd = "crates/chess-factory"
command = "/Users/sac/.local/bin/ggen"
args = ["sync"]

[tasks.factory-build]
category = "Factory"
description = "Build the chess-factory crate (lib + bins) with all features"
workspace = false
command = "cargo"
args = ["build", "-p", "chess-factory", "--all-features"]
# The factory cell is self-contained: do not inherit the workspace-wide
# `-D warnings` (sibling bcinr-logic carries pre-existing dead-code lint debt
# in its SIMD fallbacks; that is out of this manufacturing cell's scope).
env = { RUSTFLAGS = "" }
dependencies = ["chess-factory-sync"]

[tasks.factory-verify]
category = "Factory"
description = "CC=1 contract gate over the generated stations + motifs"
workspace = false
command = "cargo"
args = [
    "run", "--manifest-path", "tools/bcinr-contract-gate/Cargo.toml",
    "--release", "--quiet", "--",
    "crates/chess-factory/src/stations",
]
env = { RUSTFLAGS = "" }
dependencies = ["factory-build"]

[tasks.factory-bench]
category = "Factory"
description = "Smoke benchmark: one sanity_random cell, emits the Elo curve"
workspace = false
command = "cargo"
args = [
    "run", "-p", "chess-factory", "--bin", "bcinr_benchmark",
    "--all-features", "--",
    "--opponent", "sanity_random", "--budget", "t100us", "--games", "2",
]
env = { RUSTFLAGS = "" }
dependencies = ["factory-build"]

[tasks.factory-kaizen]
category = "Factory"
description = "Emit one DemoteStationWeight Kaizen recommendation from the curve"
workspace = false
command = "cargo"
args = ["run", "-p", "chess-factory", "--bin", "bcinr_kaizen", "--all-features"]
env = { RUSTFLAGS = "" }
dependencies = ["factory-bench"]

[tasks.factory]
category = "Factory"
description = "Full factory chain: sync -> build -> contract-gate -> smoke bench -> kaizen"
workspace = false
dependencies = [
    "chess-factory-sync",
    "factory-build",
    "factory-verify",
    "factory-bench",
    "factory-kaizen",
]

[tasks.perf-branch-gate]
category = "Verification"
description = "Gate: branch mispredictions < 0.1% of retired instructions (Linux perf stat)"
workspace = false
condition = { platforms = ["linux"] }
script_runner = "bash"
script = [
    "set -euo pipefail",
    "echo 'Building benchmark binary...'",
    "cargo build --release -p bcinr-powl --bench scheduler_bench 2>/dev/null || cargo build --release -p bcinr-powl 2>/dev/null",
    "BENCH_BIN=$(find target/release -name 'scheduler_bench' -type f | head -1)",
    "if [ -z \"$BENCH_BIN\" ]; then echo 'ERROR: bench binary not found'; exit 1; fi",
    "PERF_OUT=$(perf stat -e instructions,branch-misses -- \"$BENCH_BIN\" --bench 2>&1 || true)",
    "echo \"$PERF_OUT\"",
    "INSTRUCTIONS=$(echo \"$PERF_OUT\" | grep -E 'instructions' | head -1 | awk '{gsub(/,/,\"\"); print $1}')",
    "BRANCH_MISSES=$(echo \"$PERF_OUT\" | grep -E 'branch-misses' | head -1 | awk '{gsub(/,/,\"\"); print $1}')",
    "if [ -z \"$INSTRUCTIONS\" ] || [ \"$INSTRUCTIONS\" = '0' ]; then echo 'NOTE: perf stat not available on this platform. macOS: use Instruments > CPU Counters.'; exit 0; fi",
    "MISS_BP=$(( BRANCH_MISSES * 10000 / INSTRUCTIONS ))",
    "echo \"Branch miss rate: ${MISS_BP} basis points (${BRANCH_MISSES} misses / ${INSTRUCTIONS} instructions)\"",
    "if [ \"$MISS_BP\" -ge 10 ]; then echo \"GATE FAIL: ${MISS_BP} bp >= 10 bp (0.1% threshold)\"; exit 1; fi",
    "echo \"GATE PASS: ${MISS_BP} bp < 10 bp\"",
]

[tasks.ci]
category = "CI"
description = "Comprehensive CI pipeline"
dependencies = ["fmt", "check", "clippy", "scan-cheats", "contract-gate", "factory-verify", "test", "audit", "deny"]

[tasks.default]
alias = "ci"
