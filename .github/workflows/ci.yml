          ''',
          ''''''))

          replacements.append((
          '''fn parse_effect(expr: &SExpr) -> Result<PddlEffect, Pddl8Error> {
              let list = expr.list()?;
              let head = list
                  .first()
                  .ok_or_else(|| Pddl8Error::ParseError("empty effect".into()))?
                  .atom()?;
              match head {''',
          '''fn parse_effect(expr: &SExpr) -> Result<PddlEffect, Pddl8Error> {
              let list = expr.list()?;
              let head = list
                  .first()
                  .ok_or_else(|| Pddl8Error::ParseError("empty effect".into()))?
                  .atom()?;
              if list.len() == 3 && matches!(&list[2], SExpr::List(_)) {
