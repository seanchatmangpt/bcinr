[package]
name = "bcinr-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP server exposing bcinr planning, POWL execution, and receipt tools (admission-key cache library surface)"
repository = "https://github.com/seanchatmangpt/bcinr"

[lib]
name = "bcinr_mcp"
path = "src/lib.rs"

[[bin]]
name = "bcinr-mcp"
path = "src/main.rs"

[dev-dependencies]
chicago-tdd-mcp = { version = "26.7.1", features = ["testing"] }
tokio = { version = "1", features = ["full"] }

[dependencies]
rmcp = { version = "2.0.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bcinr-pddl = { path = "../bcinr-pddl" }
bcinr-powl = { path = "../bcinr-powl" }
bcinr-logic = { path = "../bcinr-logic" }
bcinr-api = { path = "../bcinr-api" }
bcinr-powl-receipt = { path = "../bcinr-powl-receipt" }
wasm4pm-compat = "26.6"
blake3 = "1"
# MCP+ admission-key cache (docs/DFCM... see cache.rs) — async-aware, matches
# the Tokio runtime rmcp already requires.
moka = { version = "0.12", features = ["future"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
