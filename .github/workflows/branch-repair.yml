name: Branch Repair

on:
  push:
    branches:
      - agent/finish-bcinr-lsp
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  repair:
    name: Format and lock workspace
    if: github.event_name == 'push' || github.head_ref == 'agent/finish-bcinr-lsp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-bcinr-lsp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Manufacture deterministic workspace outputs
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit deterministic outputs
        run: |
          if git diff --quiet -- Cargo.lock crates/bcinr-pddl-lsp; then
            echo "Workspace formatting and lockfile are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/bcinr-pddl-lsp
          git commit -m "chore: format restored LSP and refresh lockfile"
          git push origin HEAD:agent/finish-bcinr-lsp
