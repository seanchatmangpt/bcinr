[package]
name = "bcinr-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for bcinr via wasm-bindgen"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/bcinr"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcinr-logic = { path = "../bcinr-logic", features = ["std"] }
bcinr-powl = { path = "../bcinr-powl" }

[profile.release]
opt-level = "z"
lto = true
