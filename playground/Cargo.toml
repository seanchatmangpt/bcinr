[package]
name = "playground"
version = "0.1.0"
edition = "2021"

[dependencies]
bcinr = { path = "../bcinr" }
bcinr-logic = { path = "../crates/bcinr-logic" }
wasm4pm-compat = { version = "26.6.28" }
rayon = "1.10.0"
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
chess = "3.2.0"
blake3 = "1.8.5"
serde = "1.0.228"
serde_json = "1.0.150"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "process_intel_bench"
harness = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
