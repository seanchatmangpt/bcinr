name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  pr-fast:
    name: PR Fast Semantic Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # No `cargo fmt --check` gate: formatting is run by hand. Gating on it
      # also collides with `ggen sync`, which emits compact output that rustfmt
      # then reformats -- the two can never both be satisfied.
      #
      # No separate `cargo check`: Clippy runs the same type-check front-end
      # over a superset of targets (--all-targets), so it is strictly subsumed.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # `--features std`, NOT `--all-features`: bcinr-cmca's feature list is
      # alloc, std, and mutant_1..mutant_11 -- the latter are deliberate
      # compile-time sabotage switches meant to be enabled ONE AT A TIME (see
      # the hostile-mutant step below). `--all-features` arms all eleven at once
      # and fails 4 lib tests by design. `std` implies `alloc`, so this is full
      # non-mutant coverage, which is what "baseline" meant.
      - name: CMCA non-mutant baseline
        run: cargo test -p bcinr-cmca --features std
      - name: CMCA calibration
        run: cargo test -p bcinr-cmca --test calibration
      - name: CMCA differential
        # CMCA-117: PROPTEST_CASES defaults to 1 (see differential.rs's
        # `with_cases` config), which is not the ~1500-6800 comparisons the
        # crate's own DIFFERENTIAL_TOLERANCE measurement was based on -- no
        # workflow overrode it, so CI's real per-run coverage of this suite
        # was 1 fresh case plus the pinned regression seeds. 4096 gives real
        # per-run coverage without materially slowing pr-fast (measured
        # locally: comfortably within the existing job's runtime budget).
        run: cargo test -p bcinr-cmca --test differential
        env:
          PROPTEST_CASES: "4096"
      - name: CMCA hostile-mutant baseline
        run: cargo test -p bcinr-cmca --test hostile_mutants
      - name: CMCA compile-fail contracts
        run: cargo test -p bcinr-cmca --test compile_fail_tests
      - name: PDDL canonical IPC
        run: cargo test -p bcinr-pddl --all-features --test canonical_ipc
      - name: PDDL v2 grounding
        run: cargo test -p bcinr-pddl --all-features ground_v2
      - name: POWL 2.0
        run: cargo test -p bcinr-powl --all-features powl2
      - name: POWL scheduler v2
        run: cargo test -p bcinr-powl --all-features scheduler_v2
      - name: POWL receipt execution v2
        run: cargo test -p bcinr-powl --all-features receipt::execution_v2
      - name: Locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

  main-linux:
    name: Main Linux Production Rail
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # No `cargo fmt --check` gate: formatting is run by hand. Gating on it
      # also collides with `ggen sync`, which emits compact output that rustfmt
      # then reformats -- the two can never both be satisfied.
      #
      # No separate `cargo check`: Clippy runs the same type-check front-end
      # over a superset of targets (--all-targets), so it is strictly subsumed.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Deliberately NOT --all-features: bcinr-cmca declares mutant_1..mutant_11,
      # compile-time sabotage switches whose purpose is to make tests fail (see
      # crates/bcinr-cmca/Cargo.toml). --all-features arms all eleven at once and
      # fails 15 targets by design -- e.g. mutant_7 inverts const_eq_u32, so every
      # saturating_div takes the saturate path and escort_power returns u32::MAX.
      # Mutants are meant to be enabled one at a time. Clippy above keeps
      # --all-features: the mutants change behaviour, not compilation.
      - name: Full Linux workspace
        run: cargo test --workspace --all-targets --no-fail-fast
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
