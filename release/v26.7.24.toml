version = "26.7.24"
status = "BUILD_UNKNOWN"
release_branch = "agent/v26.7.24-production-pddl-powl-v2"
release_pr = 8

[publish]
order = [
  "wasm4pm-compat",
  "bcinr-powl",
  "bcinr-powl-receipt",
  "bcinr-pddl",
]

[crates.wasm4pm-compat]
version = "26.7.24"
source_pr = "seanchatmangpt/wasm4pm-compat#6"
required_before = ["bcinr-powl", "bcinr-pddl"]

[crates.bcinr-powl]
version = "26.7.24"
canonical_suites = ["powl2", "scheduler_v2"]

[crates.bcinr-powl-receipt]
version = "26.7.24"
canonical_suites = ["execution_v2"]

[crates.bcinr-pddl]
version = "26.7.24"
canonical_suites = [
  "canonical_ipc",
  "ground_v2",
  "semantic_features",
  "production_capability",
  "production",
  "cognitive",
  "downstream",
  "undeclared_semantics",
  "downstream_pddl_powl",
  "downstream_cognitive",
]

[gates]
required = [
  "focused-local-pddl-powl-verifier",
  "wasm4pm-compat-26.7.24-published",
]
local_command = "bash scripts/verify-pddl-powl-v26.7.24.sh"
required_receipt = "PDDL_TO_POWL_V26_7_24=ALIVE"

[blockers]
items = [
  "focused local verifier must emit PDDL_TO_POWL_V26_7_24=ALIVE on the final head",
  "wasm4pm-compat 26.7.24 must pass its verifier and be published",
  "bcinr must consume the fixed wasm4pm-compat release",
  "temporary quick-xml advisory exceptions must be deleted",
]
