name: v26.7.26 Final Repair Bootstrap

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair-and-prove:
    if: github.head_ref == 'agent/close-v26-7-26-release-gaps'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned benchmark compiler
        run: rustup toolchain install nightly-2026-07-24 --profile minimal
      - name: Repair exact remaining diagnostics
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee repair.log) 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path: str, transform) -> str:
              file = Path(path)
              before = file.read_text(encoding="utf-8")
              after = transform(before)
              if before == after:
                  print(f"UNCHANGED {path}")
              else:
                  print(f"CHANGED {path}")
                  file.write_text(after, encoding="utf-8")
              return after

          def require(path: str, text: str, needle: str, count: int | None = None) -> None:
              actual = text.count(needle)
              if actual == 0 or (count is not None and actual != count):
                  raise SystemExit(
                      f"REPAIR_REFUSED: {path}: {needle!r} count={actual}, expected={count or '>=1'}"
                  )
              print(f"ADMITTED {path}: {needle!r} count={actual}")

          radiation_path = "crates/bcinr-cmca/tests/usecase_radiation_hardened.rs"
          def repair_radiation(text: str) -> str:
              text = re.sub(
                  r"    for i in 1\.\.results\.len\(\) \{\n        for j in 0\.\.N \{\n            assert_eq!\(\n                results\[i\]\[j\], results\[0\]\[j\],\n                (\"allocation[^\n]+\")\n            \);\n        \}\n    \}",
                  r"    for result in results.iter().skip(1) {\n        for (value, baseline) in result.iter().zip(&results[0]) {\n            assert_eq!(\n                value, baseline,\n                \1\n            );\n        }\n    }",
                  text,
                  count=1,
              )
              text = re.sub(
                  r"        for j in 0\.\.N \{\n            assert_eq!\(\n                repeat\[j\], baseline\[j\],\n                (\"identical round[^\n]+\")\n            \);\n        \}",
                  r"        for (value, baseline_value) in repeat.iter().zip(&baseline) {\n            assert_eq!(\n                value, baseline_value,\n                \1\n            );\n        }",
                  text,
                  count=1,
              )
              return text
          radiation = edit(radiation_path, repair_radiation)
          require(radiation_path, radiation, "results.iter().skip(1)", 1)
          require(radiation_path, radiation, "repeat.iter().zip(&baseline)", 1)

          fairness_path = "crates/bcinr-cmca/tests/usecase_ml_fairness_audit.rs"
          def repair_fairness(text: str) -> str:
              text = re.sub(
                  r"        for i in 0\.\.N \{\n            assert!\(\n                alloc\[i\]\.val > 0,\n                (\"round[^\n]+\"),\n                round,\n                i\n            \);\n        \}",
                  r"        for (i, allocation) in alloc.iter().enumerate().take(N) {\n            assert!(\n                allocation.val > 0,\n                \1,\n                round,\n                i\n            );\n        }",
                  text,
                  count=1,
              )
              text = re.sub(
                  r"        for i in 0\.\.N \{\n            assert_eq!\(\n                alloc\[i\], baseline\[i\],\n                (\"round[^\n]+\"),\n                round, i\n            \);\n        \}",
                  r"        for (i, (allocation, baseline_allocation)) in alloc.iter().zip(&baseline).enumerate() {\n            assert_eq!(\n                allocation, baseline_allocation,\n                \1,\n                round, i\n            );\n        }",
                  text,
                  count=1,
              )
              text = re.sub(
                  r"    for i in 0\.\.N \{\n        assert_eq!\(\n            platform_alloc\[i\], auditor_replay\[i\],\n            (\"auditor[^\n]+\"),\n            i\n        \);\n    \}",
                  r"    for (i, (platform, replay)) in platform_alloc.iter().zip(&auditor_replay).enumerate() {\n        assert_eq!(\n            platform, replay,\n            \1,\n            i\n        );\n    }",
                  text,
                  count=1,
              )
              text = text.replace(
                  "let max_idx = (0..N).max_by_key(|&i| alloc[i].val).unwrap();",
                  "let max_idx = alloc\n        .iter()\n        .enumerate()\n        .max_by_key(|(_, allocation)| allocation.val)\n        .map(|(index, _)| index)\n        .unwrap();",
              )
              return text
          fairness = edit(fairness_path, repair_fairness)
          require(fairness_path, fairness, "alloc.iter().enumerate().take(N)", 1)
          require(fairness_path, fairness, "alloc.iter().zip(&baseline).enumerate()", 1)
          require(fairness_path, fairness, "platform_alloc.iter().zip(&auditor_replay).enumerate()", 1)
          require(fairness_path, fairness, ".max_by_key(|(_, allocation)| allocation.val)", 1)

          compliance_path = "crates/bcinr-powl/tests/usecase_compliance_audit.rs"
          def repair_compliance(text: str) -> str:
              text = text.replace(
                  "let mut op_trace = 0u64;",
                  "let mut op_trace = 0u64;\n    let mut ticks = 0u32;",
                  1,
              )
              text = text.replace(
                  "let mut bits = scheduler_tick(&tape.ops[..tape.len as usize], &mut state).0;",
                  "ticks += 1;\n        let mut bits = scheduler_tick(&tape.ops[..tape.len as usize], &mut state).0;",
                  1,
              )
              text = text.replace(
                  "log.record_op_fired(run_id, op_idx, 0).unwrap();",
                  "log.record_op_fired(run_id, op_idx, ticks, 1).unwrap();",
              )
              text = text.replace(
                  "log.record_run_sealed(run_id, op_trace).unwrap();",
                  "log.record_run_sealed(run_id, op_trace, ticks).unwrap();",
              )
              replacements = {
                  "log_tampered.record_op_fired(run_id, 0, 0).unwrap();":
                      "log_tampered.record_op_fired(run_id, 0, 0, 1).unwrap();",
                  "log_tampered.record_op_fired(run_id, 1, 0).unwrap();":
                      "log_tampered.record_op_fired(run_id, 1, 1, 1).unwrap();",
                  "log_tampered.record_op_fired(run_id, 99, 0).unwrap();":
                      "log_tampered.record_op_fired(run_id, 99, 2, 1).unwrap();",
                  "log_tampered.record_run_sealed(run_id, 0b111).unwrap();":
                      "log_tampered.record_run_sealed(run_id, 0b111, 3).unwrap();",
                  "incomplete_log.record_op_fired(1, 1, 0).unwrap();":
                      "incomplete_log.record_op_fired(1, 1, 0, 1).unwrap();",
                  "incomplete_log.record_run_sealed(1, 0b10).unwrap();":
                      "incomplete_log.record_run_sealed(1, 0b10, 1).unwrap();",
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              return text
          compliance = edit(compliance_path, repair_compliance)
          require(compliance_path, compliance, "record_op_fired(run_id, op_idx, ticks, 1)", 1)
          if re.search(r"record_op_fired\([^\n]+, 0\)\.unwrap", compliance):
              raise SystemExit(f"REPAIR_REFUSED: {compliance_path}: stale OCEL call remains")

          chaos_harness_path = "crates/bcinr-powl/tests/chaos_harness.rs"
          chaos_harness = edit(
              chaos_harness_path,
              lambda text: text
                  .replace("ticks as u32, 1", "ticks, 1")
                  .replace("state.done_mask, ticks as u32", "state.done_mask, ticks"),
          )
          if "ticks as u32" in chaos_harness:
              raise SystemExit(f"REPAIR_REFUSED: {chaos_harness_path}: unnecessary cast remains")

          chaos_scenarios_path = "crates/bcinr-powl/tests/chaos_scenarios.rs"
          def repair_chaos_scenarios(text: str) -> str:
              if "fn test_chaos_config_default_is_bounded" not in text:
                  marker = "/// Test 1: Crash injection after 5 of 10 sequential operations."
                  test = '''#[test]
          fn test_chaos_config_default_is_bounded() {
              let config = ChaosConfig::default();
              assert_eq!(config.max_ticks, 100);
              assert_eq!(config.crash_after_tick, None);
              assert_eq!(config.delay_ticks, 0);
              assert!(!config.verify_duplicate_tick_idempotence);
              assert!(!config.reorder_ready_set);
          }

          '''
                  text = text.replace(marker, test + marker, 1)
              needle = "let result = run_with_reorder_injection(&tape, 42, 50);"
              replacement = needle + '''

              assert!(
                  result.ticks_executed > 0,
                  "reorder injection must execute at least one scheduler tick"
              );'''
              text = text.replace(needle, replacement, 1)
              return text
          chaos_scenarios = edit(chaos_scenarios_path, repair_chaos_scenarios)
          require(chaos_scenarios_path, chaos_scenarios, "fn test_chaos_config_default_is_bounded", 1)
          require(chaos_scenarios_path, chaos_scenarios, "result.ticks_executed > 0", 1)

          swarm_path = "crates/bcinr-powl/tests/usecase_swarm_02_parallel_independent_workers.rs"
          swarm = edit(
              swarm_path,
              lambda text: text.replace(
                  "ticks >= 1 && ticks <= 128,",
                  "(1..=128).contains(&ticks),",
                  1,
              ),
          )
          require(swarm_path, swarm, "(1..=128).contains(&ticks)", 1)

          verifier_path = "scripts/generate_v26_7_26_report.sh"
          verifier = edit(
              verifier_path,
              lambda text: text
                  .replace(
                      "CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo bench -p bcinr-pddl",
                      "CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo +nightly-2026-07-24 bench -p bcinr-pddl",
                  )
                  .replace(
                      "CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo bench -p bcinr-powl",
                      "CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo +nightly-2026-07-24 bench -p bcinr-powl",
                  ),
          )
          require(verifier_path, verifier, "cargo +nightly-2026-07-24 bench", 2)

          workflow_path = ".github/workflows/v26-7-26-release-validation.yml"
          def repair_workflow(text: str) -> str:
              if "Install pinned benchmark compiler" in text:
                  return text
              marker = "      - name: Validate verifier syntax\n"
              step = '''      - name: Install pinned benchmark compiler
                  run: rustup toolchain install nightly-2026-07-24 --profile minimal
          '''
              return text.replace(marker, step + marker, 1)
          workflow = edit(workflow_path, repair_workflow)
          require(workflow_path, workflow, "Install pinned benchmark compiler", 1)
          PY

          cargo fmt --all
          git diff --check

          echo '=== FULL WORKSPACE CLIPPY ==='
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          echo '=== PINNED TEMPORAL BENCHMARK ==='
          CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo +nightly-2026-07-24 bench -p bcinr-pddl --bench phase1_temporal -- --noplot
          echo '=== PINNED SCHEDULER BENCHMARK ==='
          CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo +nightly-2026-07-24 bench -p bcinr-powl --bench phase3_scheduler -- --noplot

          mapfile -t changed < <(git diff --name-only)
          allowed=(
            .github/workflows/v26-7-26-release-validation.yml
            crates/bcinr-cmca/tests/usecase_ml_fairness_audit.rs
            crates/bcinr-cmca/tests/usecase_radiation_hardened.rs
            crates/bcinr-powl/tests/chaos_harness.rs
            crates/bcinr-powl/tests/chaos_scenarios.rs
            crates/bcinr-powl/tests/usecase_compliance_audit.rs
            crates/bcinr-powl/tests/usecase_swarm_02_parallel_independent_workers.rs
            scripts/generate_v26_7_26_report.sh
          )
          printf 'CHANGED FILES\n%s\n' "${changed[*]}"
          if [[ ${#changed[@]} -ne ${#allowed[@]} ]]; then
            echo "REPAIR_REFUSED: changed-file cardinality mismatch" >&2
            exit 1
          fi
          for expected in "${allowed[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "${expected}" || {
              echo "REPAIR_REFUSED: missing expected change ${expected}" >&2
              exit 1
            }
          done

          git config user.name "BCINR Release Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${allowed[@]}"
          git commit -m "fix(release): close final clippy and benchmark blockers"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload final repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-26-final-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: repair.log
          if-no-files-found: warn
          retention-days: 7
