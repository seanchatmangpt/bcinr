[package]
name = "bcinr-bench-auditor"
version = "26.7.25"
edition = "2021"

license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/bcinr"
description = "Audits benchmark coverage: every public bcinr-logic algorithm must have a benchmark call site in the workspace's benches; reports the uncovered list."
readme = "../../README.md"
categories = ["algorithms", "no-std"]
keywords = ["branchless", "simd", "performance"]

[dependencies]
syn = { version = "2.0.117", features = ["full", "visit", "extra-traits"] }
walkdir = "2.5.0"
