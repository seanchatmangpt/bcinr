# =============================================================================
# GGEN Chess Factory — MEASUREMENT manifest.
#
# `cd crates/chess-factory && ggen sync --manifest ggen-benchmark.toml` lowers
# ontology/benchmark.ttl into schema/benchmark_matrix.json: the opponent x
# budget-tier cross product the `bcinr_benchmark` runner sweeps to measure
# Decision-Engine Elo(tau).
#
# Kept separate from ggen.toml so the program-law (chess.ttl) and
# measurement-law (benchmark.ttl) graphs stay independent — the UHFT swap
# replaces chess.ttl while reusing this benchmark machinery unchanged.
#
# PROVISION LAW: every {{row.X}} the template uses MUST be a column its paired
# SELECT projects (GGEN-TPL-001); the SELECT ends with ORDER BY a stable key.
# =============================================================================

[project]
name = "chess-factory-benchmark"
version = "0.1.0"
description = "Elo(tau) benchmark matrix manufactured from measurement law"

[ontology]
source = "ontology/benchmark.ttl"
base_iri = "https://bcinr.dev/chess-factory/ontology#"

[ontology.prefixes]
cf   = "https://bcinr.dev/chess-factory/ontology#"
rdf  = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd  = "http://www.w3.org/2001/XMLSchema#"

[inference]
[[inference.rules]]
name = "mark_measurement_cells"
description = "Tag every Opponent and BudgetTier as a measurement cell."
order = 0
construct = """
PREFIX cf: <https://bcinr.dev/chess-factory/ontology#>
CONSTRUCT { ?cell cf:isMeasurementCell true . }
WHERE {
  { ?cell a cf:Opponent . }
  UNION
  { ?cell a cf:BudgetTier . }
}
"""

[generation]
output_dir = "."

# ---------------------------------------------------------------------------
# Rule: benchmark_matrix  (STATIC -> opponent x budget cross product)
#   queries/benchmark_matrix.rq -> templates/benchmark_matrix.json.tera
#   -> schema/benchmark_matrix.json
# ---------------------------------------------------------------------------
[[generation.rules]]
name = "benchmark_matrix"
query = { file = "queries/benchmark_matrix.rq" }
template = { file = "templates/benchmark_matrix.json.tera" }
output_file = "schema/benchmark_matrix.json"
mode = "Overwrite"
