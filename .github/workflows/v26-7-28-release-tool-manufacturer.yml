name: v26.7.28 Release Tool Rustfmt Manufacturer

on:
  push:
    branches:
      - agent/v26.7.28-production-admission
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v26-7-28-release-tool-rustfmt
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-25

jobs:
  manufacture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/v26.7.28-production-admission
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact rustfmt
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-07-25
          components: rustfmt

      - name: Manufacture canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Refuse unexpected manufacturer mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          output = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              text=True,
          )
          unexpected = []
          for raw in output.splitlines():
              path = raw[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if not path.startswith('tools/bcinr-release/src/'):
                  unexpected.append(raw)
          if unexpected:
              raise SystemExit('unexpected rustfmt mutations:\n' + '\n'.join(unexpected))
          PY

      - name: Publish canonical source and delete manufacturer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v26-7-28-release-tool-manufacturer.yml
          git diff --check
          git add tools/bcinr-release/src \
            .github/workflows/v26-7-28-release-tool-manufacturer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(v26.7.28): rustfmt hardened release tool'
          git push origin HEAD:agent/v26.7.28-production-admission
