[package]
name = "chess-factory"
version = "0.1.0"
edition = "2021"
description = "GGEN Chess Factory: branchless chess decision stations generated from law (TTL -> SPARQL -> GGEN -> Tera -> Rust)"
license = "MIT OR Apache-2.0"

[lib]
name = "chess_factory"

[features]
default = ["std"]
# Enables std-backed boundary helpers (FEN parsing, `PositionView::from_board`)
# and the runtime bins. The core station library stays `no_std` by default.
std = ["dep:chess", "dep:blake3", "dep:serde", "dep:serde_json"]

[dependencies]
bcinr-logic = { path = "../bcinr-logic" }
chess = { version = "3.2.0", optional = true }
blake3 = { version = "1", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[[bin]]
name = "bcinr_factory"
required-features = ["std"]

[[bin]]
name = "bcinr_verify"
required-features = ["std"]

[[bin]]
name = "bcinr_benchmark"
required-features = ["std"]

[[bin]]
name = "sanity_random"
required-features = ["std"]

[[bin]]
name = "sanity_greedy"
required-features = ["std"]

[[bin]]
name = "bcinr_kaizen"
required-features = ["std"]

[[bin]]
name = "print_book_hashes"
path = "src/bin/print_book_hashes.rs"
required-features = ["std"]

[[bin]]
name = "gen_book"
path = "src/bin/gen_book.rs"
required-features = ["std"]

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"

[lints.rust]
unsafe_code = "forbid"
