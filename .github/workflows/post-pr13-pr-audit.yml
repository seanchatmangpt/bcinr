name: Post-PR13 Audit Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: post-pr13-audit-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-pr13-semantic-audit
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Execute non-publishing audit replay
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^        run: |$/,$p' .github/workflows/post-pr13-audit.yml \
            | tail -n +2 \
            | sed 's/^          //' > /tmp/post-pr13-audit.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/post-pr13-audit.sh')
          text = path.read_text()
          anchor = "python3 scripts/adapt_semantic_integration.py\n"
          repair = anchor + """python3 - <<'PY_REPAIR'
          from pathlib import Path
          differential = Path('crates/bcinr-cmca/tests/differential.rs')
          source = differential.read_text()
          for terminal in range(2, 8):
              source = source.replace(
                  f"if v == {terminal} {{ -1 }} else {{ v as i32 }}",
                  f"if v == {terminal} {{ -1 }} else {{ v }}",
              )
          differential.write_text(source)
          PY_REPAIR
          """
          if anchor not in text:
              raise SystemExit('adapter insertion point missing')
          text = text.replace(anchor, repair, 1)
          needle = "git config user.name 'OpenAI Integration Agent'"
          replacement = "exit 0\n" + needle
          if needle not in text:
              raise SystemExit('publisher insertion point missing')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          set +e
          bash /tmp/post-pr13-audit.sh > post-pr13-audit.log 2>&1
          status=$?
          set -e
          cat post-pr13-audit.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-pr13-audit-diagnostics
          path: post-pr13-audit.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce diagnostic replay
        if: steps.audit.outputs.status != '0'
        run: exit 1
