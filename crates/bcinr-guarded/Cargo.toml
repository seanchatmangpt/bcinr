[package]
name = "bcinr-guarded"
version = "26.9.15"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust projections of the bcinr admitted semantic graph. Generated by ggen from ontology/bcinr.ttl."
repository = "https://github.com/seanchatmangpt/bcinr"
readme = "../../README.md"

[dependencies]
bcinr-powl = { path = "../bcinr-powl", version = "26.9.15" }
bcinr-cmca = { path = "../bcinr-cmca", version = "26.9.15", features = ["alloc"] }
