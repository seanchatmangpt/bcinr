name: Post-PR13 Audit Trigger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: post-pr13-semantic-audit
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-pr13-semantic-audit
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Execute receipted audit script
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/^        run: |$/,$p' .github/workflows/post-pr13-audit.yml \
            | tail -n +2 \
            | sed 's/^          //' > /tmp/post-pr13-audit.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/post-pr13-audit.sh')
          text = path.read_text()
          needle = "git config user.name 'OpenAI Integration Agent'"
          replacement = "rm -f .github/workflows/post-pr13-pr-audit.yml\n" + needle
          if needle not in text:
              raise SystemExit('publisher insertion point missing')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          set +e
          bash /tmp/post-pr13-audit.sh > post-pr13-audit.log 2>&1
          status=$?
          set -e
          cat post-pr13-audit.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-pr13-audit-diagnostics
          path: post-pr13-audit.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce audit
        if: steps.audit.outputs.status != '0'
        run: exit 1
