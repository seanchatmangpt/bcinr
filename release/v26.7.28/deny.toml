[advisories]
yanked = "deny"
unmaintained = "workspace"
git-fetch-with-cli = false
unused-ignored-advisory = "deny"

[licenses]
include-dev = true
confidence-threshold = 0.93
unused-allowed-license = "allow"
unused-license-exception = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
unused-allowed-source = "allow"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]

[sources.allow-org]
github = ["seanchatmangpt"]
