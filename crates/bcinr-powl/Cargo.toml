[package]
name = "bcinr-powl"
version = "26.6.25"
edition = "2021"
description = "Partially Ordered Workflow Language runtime with branchless scheduler and cryptographic proof of execution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/bcinr"
readme = "../../README.md"
keywords = ["workflow", "branchless", "petri", "conformance", "blake3"]
categories = ["algorithms", "data-structures"]

[dependencies]
bcinr-logic = { version = "26.6.24", path = "../bcinr-logic" }
# Shared IR types/trait contracts for the multifractal-workflow (MFW)
# planner: EventSet, CausalPlan, ExecutableConcurrencyComplex, the
# PowlProjector contract. bcinr-mfw-ir has zero path-dependency back onto
# bcinr-powl (see its Cargo.toml) so this is a one-way edge, no cycle.
bcinr-mfw-ir = { version = "26.6.26", path = "../bcinr-mfw-ir" }
blake3 = "1"
wasm4pm-compat = "26.6.26"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
divan = "0.1"
trybuild = "1"
proptest = "1"
chicago-tdd-tools = { version = "26.7.1", features = ["ocel-generation"] }
serde_json = "1"

[features]
default = []
std = ["serde", "dep:serde_json"]
nightly = []
testing = []

[[bench]]
name = "powl_quick_bench"
harness = false
