[package]
name = "bcinr-powl-receipt"
version = "26.7.25"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Projection, execution, planning, and replay receipts for executable POWL v2"
repository = "https://github.com/seanchatmangpt/bcinr"
keywords = ["powl", "workflow", "receipt", "blake3", "ocel"]
categories = ["algorithms"]
readme = "../../README.md"

[dependencies]
bcinr-powl = { path = "../bcinr-powl", version = "26.7.25" }
bcinr-logic = { path = "../bcinr-logic", version = "26.7.25" }
bcinr-mfw-ir = { path = "../bcinr-mfw-ir", version = "26.7.25" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[test]]
name = "mutant_kill_g4_powl"
path = "tests/mutant_kill_g4_powl.rs"

[[bench]]
name = "receipt_bench"
harness = false
