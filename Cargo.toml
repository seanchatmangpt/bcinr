[workspace]
members = ["crates/bcinr-logic",
    "crates/bcinr-cmca", "tools/bcinr-reporter", "tools/bcinr-contract-gate", "tools/bcinr-bench-auditor", "tools/bcinr-cheat-scanner", "tools/rust_audit", "crates/encode_unicode_patch", "tools/ggen", "crates/bcinr-powl",
    "crates/bcinr-guarded", "crates/bcinr-pddl", "crates/bcinr-mfw-ir"]
default-members = ["crates/bcinr-logic"]
# Scope: this repository is the PDDL 3.1 -> POWL 2.0 derivation and the numeric
# substrate under it. Concurrency is *derived* from a domain's causal structure
# -- `bcinr-pddl::causal` proves pairwise independence, `bcinr-powl` decomposes
# and checks the result against the source net's language -- and nothing else
# in the ecosystem does that: ferroplan retired its interference test, and
# aries answers the question inside its own solver where a consumer cannot
# check it.
#
# Removed as out of scope, not as failures: `crates/bcinr-mcp` and
# `tools/bcinr-controller` (harness -- `~/mfw/mfw-planner` does this better,
# with engine admission receipts and an independently-vendored VAL),
# `crates/bcinr-ffi` and `crates/bcinr-api` and `playground` (not on the
# derivation path; bcinr-ffi additionally claimed 26.7.25 while shipping
# 26.7.28 semantics), and `crates/bcinr-pddl-lsp` (already not a member -- it
# needed a path dep into a 54G sibling repo).
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# `bench` inherits from `release` by default, which means fat LTO +
# codegen-units=1 over the *entire* dependency graph (nom, the pddl parser,
# wasm4pm-compat, criterion, ...) for every one of the bench binaries in
# bcinr-bench — that's what spiked target/ to 24-30GiB after a handful of
# `cargo bench` runs. Relative-timing benchmarks don't need whole-program
# LTO; override it to a cheap profile instead. (`panic` cannot be overridden
# here — cargo always forces `unwind` for bench/test harnesses regardless of
# what's configured, and emits a warning if you try.)
[profile.bench]
lto = false
codegen-units = 16
opt-level = 3

[patch.crates-io]
encode_unicode = { path = "crates/encode_unicode_patch" }
# prolog8 is consumed from crates.io (26.6.25) by every crate that needs it —
# no local path override, no collision risk.
#
# wasm4pm-compat 26.6.29 on crates.io now publishes the fields bcinr-pddl
# needs (fn_values, preferences, metric, object_types, typed_params,
# condition, effects, numeric_effects), so the local path patch that used
# to force every consumer onto a filesystem copy is no longer needed.
