name: v26.7.28 Release Tool Closure

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/bcinr-release/**
      - release/v26.7.28/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/v26-7-28-release-tool-closure.yml

permissions:
  contents: write

concurrency:
  group: v26-7-28-release-tool-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTUP_TOOLCHAIN: nightly-2026-07-25

jobs:
  close:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Refuse stale or unexpected branch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = 'agent/v26.7.28-production-admission'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          mkdir -p /tmp/bcinr-release-closure

      - name: Install exact nightly toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: nightly-2026-07-25
          components: rustfmt,clippy

      - name: Apply observed compiler repairs and wire standing law
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} boundary changed: observed {count}')
              return source.replace(old, new, 1)

          main_path = Path('tools/bcinr-release/src/main.rs')
          main = main_path.read_text()
          main = replace_once(
              main,
              '#![cfg_attr(unix, feature(unix_kill_process_group))]\n',
              '#![cfg_attr(unix, feature(unix_send_signal))]\n',
              'unix signal feature',
          )
          main = replace_once(main, 'mod provenance;\n', 'mod provenance;\nmod standing;\n', 'standing module')
          main = replace_once(
              main,
              'use serde::Serialize;\n',
              'use crate::standing::{calculate as calculate_standing, StandingInputs};\nuse serde::Serialize;\n',
              'standing import',
          )
          main = replace_once(
              main,
              '        let mut stop_reason = None;\n',
              "        let mut stop_reason: Option<&'static str> = None;\n",
              'stop reason type',
          )
          main = replace_once(
              main,
              '            if let Some(reason) = &stop_reason {\n',
              '            if let Some(reason) = stop_reason {\n',
              'stop reason admission',
          )
          main = replace_once(
              main,
              '                    stop_reason =\n                        Some("execution authority changed during verification".to_owned());\n',
              '                    stop_reason =\n                        Some("execution authority changed during verification");\n',
              'executable change reason',
          )
          main = replace_once(
              main,
              '                    stop_reason = Some("repository mutation stopped subsequent rails".to_owned());\n',
              '                    stop_reason = Some("repository mutation stopped subsequent rails");\n',
              'repository mutation reason',
          )

          start_marker = '    let standing = if blocked {'
          end_marker = '\n\n    let evidence_material = EvidenceMaterial {'
          if main.count(start_marker) != 1 or main.count(end_marker) != 1:
              raise SystemExit('standing calculation boundary changed')
          start = main.index(start_marker)
          end = main.index(end_marker, start)
          replacement = '''    let standing = calculate_standing(StandingInputs {
              blocked,
              required_rail_failure,
              required_artifact_failure,
              required_identity_failure,
              optional_rail_failure,
              optional_artifact_failure,
              optional_identity_failure,
          });'''
          main = main[:start] + replacement + main[end:]
          main_path.write_text(main)

          executor_path = Path('tools/bcinr-release/src/executor.rs')
          executor = executor_path.read_text()
          executor = replace_once(
              executor,
              '            let candidate = directory.join(format!("{program}{extension}"));\n',
              '            let mut file_name = OsString::from(program);\n            file_name.push(extension);\n            let candidate = directory.join(file_name);\n',
              'executable suffix construction',
          )
          executor_path.write_text(executor)

          profile_path = Path('release/v26.7.28/production.json')
          profile = profile_path.read_text()
          profile = replace_once(
              profile,
              'allow-features=linux_pidfd,unix_kill_process_group',
              'allow-features=linux_pidfd,unix_send_signal',
              'nightly allow-features policy',
          )
          profile_path.write_text(profile)

          readme_path = Path('tools/bcinr-release/README.md')
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              '- `unix_kill_process_group` for descendant-complete timeout termination.',
              '- `unix_send_signal` for descendant-complete process-group signal delivery.',
              'nightly feature documentation',
          )
          readme = replace_once(
              readme,
              'allow-features=linux_pidfd,unix_kill_process_group',
              'allow-features=linux_pidfd,unix_send_signal',
              'nightly feature fence documentation',
          )
          readme_path.write_text(readme)
          PY

      - name: Format release crate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find tools/bcinr-release/src -type f -name '*.rs' -print0 | sort -z
          )
          test "${#files[@]}" -gt 0
          rustfmt --edition 2021 "${files[@]}"
          rustfmt --edition 2021 --check "${files[@]}"

      - name: Materialize lockfile and check release crate
        shell: bash
        run: |
          set +e
          cargo check -p bcinr-release --all-targets \
            > /tmp/bcinr-release-closure/check.log 2>&1
          status=$?
          set -e
          tail -n 200 /tmp/bcinr-release-closure/check.log
          exit "$status"

      - name: Replay locked check
        shell: bash
        run: |
          set +e
          cargo check --locked -p bcinr-release --all-targets \
            > /tmp/bcinr-release-closure/check-locked.log 2>&1
          status=$?
          set -e
          tail -n 200 /tmp/bcinr-release-closure/check-locked.log
          exit "$status"

      - name: Execute release-crate tests
        shell: bash
        run: |
          set +e
          cargo test --locked -p bcinr-release \
            > /tmp/bcinr-release-closure/test.log 2>&1
          status=$?
          set -e
          tail -n 200 /tmp/bcinr-release-closure/test.log
          exit "$status"

      - name: Lint release crate
        shell: bash
        run: |
          set +e
          cargo clippy --locked -p bcinr-release --all-targets -- -D warnings \
            > /tmp/bcinr-release-closure/clippy.log 2>&1
          status=$?
          set -e
          tail -n 200 /tmp/bcinr-release-closure/clippy.log
          exit "$status"

      - name: Retain closure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v26-7-28-release-tool-closure-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: /tmp/bcinr-release-closure
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Refuse unexpected closure mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              'Cargo.lock',
              'tools/bcinr-release/src/main.rs',
              'tools/bcinr-release/src/executor.rs',
              'tools/bcinr-release/README.md',
              'release/v26.7.28/production.json',
              '.github/workflows/v26-7-28-release-tool-closure.yml',
          }
          output = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              text=True,
          )
          unexpected = []
          for raw in output.splitlines():
              path = raw[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path not in allowed:
                  unexpected.append(raw)
          if unexpected:
              raise SystemExit('unexpected closure mutations:\n' + '\n'.join(unexpected))
          PY

      - name: Publish verified closure and delete workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v26-7-28-release-tool-closure.yml
          git diff --check
          git add Cargo.lock \
            tools/bcinr-release/src/main.rs \
            tools/bcinr-release/src/executor.rs \
            tools/bcinr-release/README.md \
            release/v26.7.28/production.json \
            .github/workflows/v26-7-28-release-tool-closure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(v26.7.28): close hardened release tool'
          git push origin HEAD:agent/v26.7.28-production-admission
