name: v26.7.26 Release Validation

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v26-7-26-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  preflight:
    name: Verify materialized release tree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify lockfile and formatting are materialized
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p bcinr-ffi --locked
          cargo fmt --all -- --check
          git diff --exit-code -- Cargo.lock '*.rs'
          git diff --check

  validate:
    name: Execute release verifier
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Validate verifier syntax
        run: |
          bash -n scripts/generate_v26_7_26_report.sh
          python3 -m py_compile scripts/verify_v26_7_26_structure.py
      - name: Admit Phase 1 structure
        shell: bash
        run: |
          mkdir -p target/v26.7.26-structure
          set -o pipefail
          python3 scripts/verify_v26_7_26_structure.py --phase 1 2>&1 | tee target/v26.7.26-structure/phase-1.log
      - name: Admit Phase 2 structure
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify_v26_7_26_structure.py --phase 2 2>&1 | tee target/v26.7.26-structure/phase-2.log
      - name: Admit Phase 3 structure
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify_v26_7_26_structure.py --phase 3 2>&1 | tee target/v26.7.26-structure/phase-3.log
      - name: Admit Phase 4 structure
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify_v26_7_26_structure.py --phase 4 2>&1 | tee target/v26.7.26-structure/phase-4.log
      - name: Admit Phase 5 structure
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify_v26_7_26_structure.py --phase 5 2>&1 | tee target/v26.7.26-structure/phase-5.log
      - name: Admit Phase 6 structure
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify_v26_7_26_structure.py --phase 6 2>&1 | tee target/v26.7.26-structure/phase-6.log
      - name: Admit Phase 7 structure
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/verify_v26_7_26_structure.py --phase 7 2>&1 | tee target/v26.7.26-structure/phase-7.log
      - name: Upload structural receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-26-structure-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/v26.7.26-structure/
          if-no-files-found: error
          retention-days: 30
      - name: Execute all v26.7.26 release rails
        id: verify
        shell: bash
        run: bash scripts/generate_v26_7_26_report.sh
      - name: Publish report to job summary
        if: always()
        shell: bash
        run: |
          report="$(find target/v26.7.26-verification -name v26_7_26_verification_report.md -type f | sort | tail -1)"
          if [[ -n "${report}" && -f "${report}" ]]; then
            cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Release verifier did not produce a report." >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload executable receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-26-release-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/v26.7.26-verification/
          if-no-files-found: warn
          retention-days: 30
