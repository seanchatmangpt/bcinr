name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary, read-only manufacturing rail. It emits exact replacement files
  # as an artifact and is removed before merge.
  manufacture_lsp_repair:
    name: Manufacture LSP semantic repair
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/finish-bcinr-lsp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Replace stub ANDON dependency
        run: python3 .github/scripts/repair_lsp.py
      - name: Format and resolve workspace
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Stage exact replacement files
        run: |
          mkdir -p repair/crates/bcinr-pddl-lsp/src/andon_bus
          cp Cargo.lock repair/Cargo.lock
          cp crates/bcinr-pddl-lsp/Cargo.toml repair/crates/bcinr-pddl-lsp/Cargo.toml
          cp crates/bcinr-pddl-lsp/src/backend.rs repair/crates/bcinr-pddl-lsp/src/backend.rs
          cp crates/bcinr-pddl-lsp/src/andon_bus/mod.rs repair/crates/bcinr-pddl-lsp/src/andon_bus/mod.rs
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-semantic-repair
          path: repair/
          if-no-files-found: error

  # Temporary verifier report. It captures complete concise gate output even
  # when the enforcing jobs stop at the first failure.
  gate_diagnostics:
    name: Gate diagnostics
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/finish-bcinr-lsp'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Capture clippy report
        run: |
          mkdir -p gate-report
          set +e
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings > gate-report/clippy.log 2>&1
          echo $? > gate-report/clippy.exit
          exit 0
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Capture dependency policy report
        run: |
          set +e
          cargo deny check > gate-report/deny.log 2>&1
          echo $? > gate-report/deny.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bcinr-gate-report
          path: gate-report/
          if-no-files-found: error

  # 1. Lint & Format
  style:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 2. Security Audit
  security:
    name: Security & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit & cargo-deny
        run: cargo install cargo-audit cargo-deny --locked || true
      - name: Security audit
        run: cargo audit
      - name: License & Dependency Check
        run: cargo deny check

  # 3. Test Matrix
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    needs: [style]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-make
        run: cargo install cargo-make || true
      - name: Run CI Task
        run: cargo make ci
        shell: bash

  # 4. Documentation
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
