# ggen model for the wasm4games pattern foundry.
#
# `ggen sync` loads the RDF graph in [rdf], runs each rule's SPARQL query over it, renders
# the rule's Tera template with the result rows, and writes the result to `output_file`.
# The committed files under ../src/patterns/ are produced by these rules and checked in so
# the offline build never depends on ggen. Re-run `ggen sync` after editing schema/patterns.ttl.

[project]
name = "wasm4games-patterns"
description = "Branchless game-pattern kernels and OCEL/OTEL evidence surface, generated from an RDF ontology."

[rdf]
# patterns.ttl: the 75 branchless kernel ontology. chains.ttl: 8 JTBD test chains.
files = ["schema/patterns.ttl", "schema/chains.ttl"]
base = "https://wasm4games.dev/ontology#"

[generation]
# Output paths are relative to this crate root (the parent of ggen/).
base_dir = ".."

# One branchless kernel file per pattern. The template fans out over the query rows; the
# `{name}` placeholder in `output_file` is substituted with each row's `name` binding.
[[generation.rules]]
name = "kernels"
query = { file = "queries/kernels.rq" }
template = { file = "templates/kernel.rs.tera" }
output_file = "src/patterns/{name}.rs"
fanout = "name"

# The patterns module: declarations, re-exports, and PATTERN_REGISTRY (single file).
[[generation.rules]]
name = "patterns_mod"
query = { file = "queries/pattern_index.rq" }
template = { file = "templates/patterns_mod.rs.tera" }
output_file = "src/patterns/mod.rs"

# The object-centric event schema reference (single file).
[[generation.rules]]
name = "ocel_schema"
query = { file = "queries/ocel_schema.rq" }
template = { file = "templates/ocel_schema.rs.tera" }
output_file = "src/evidence/ocel_schema.rs"

# Alexander pattern-language docs: one scaffold .md per pattern (scaffold-then-edit).
# The generated files carry a SCAFFOLDED banner — users SHOULD hand-edit them to fill
# in Context/Forces/Solution/Consequences. Re-running `ggen sync` overwrites structural
# sections; commit narrative edits before re-scaffolding.
[[generation.rules]]
name = "pattern_docs"
query = { file = "queries/pattern_docs.rq" }
template = { file = "templates/pattern_doc.md.tera" }
output_file = "docs/patterns/{name}.md"
fanout = "name"

# Alexander pattern-language index: single INDEX.md listing all 75 patterns by family.
[[generation.rules]]
name = "patterns_index"
query = { file = "queries/pattern_index_docs.rq" }
template = { file = "templates/patterns_index.md.tera" }
output_file = "docs/patterns/INDEX.md"
