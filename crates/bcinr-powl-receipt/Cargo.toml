[package]
name = "bcinr-powl-receipt"
version = "26.6.24"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OCEL event emission and causal receipt generation for bcinr-powl"
repository = "https://github.com/seanchatmangpt/bcinr"

[dependencies]
bcinr-powl = { path = "../bcinr-powl", version = "26.6.25" }
bcinr-logic = { path = "../bcinr-logic", version = "26.6.24" }
# Shared IR types (Digest, EventSet, CausalPlan, ExecutableConcurrencyComplex,
# PowlProjectionWitness, the semantic ID newtypes) for the new
# projection/execution/planning receipts. Zero path-dependency back onto
# bcinr-powl-receipt (see bcinr-mfw-ir's own Cargo.toml), so this stays a
# one-way edge, no cycle.
bcinr-mfw-ir = { path = "../bcinr-mfw-ir", version = "26.6.26" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "receipt_bench"
harness = false
