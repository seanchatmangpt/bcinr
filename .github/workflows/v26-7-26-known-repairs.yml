name: v26.7.26 Known Repair Bootstrap

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/close-v26-7-26-release-gaps'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Apply observed repairs and prove postconditions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee repair.log
          from pathlib import Path
          import re

          def edit(path: str, transform) -> str:
              file = Path(path)
              before = file.read_text(encoding="utf-8")
              after = transform(before)
              if before == after:
                  print(f"UNCHANGED {path}")
              else:
                  print(f"CHANGED {path}")
                  file.write_text(after, encoding="utf-8")
              return after

          def require(path: str, text: str, needle: str, count: int | None = None) -> None:
              actual = text.count(needle)
              if actual == 0 or (count is not None and actual != count):
                  raise SystemExit(
                      f"REPAIR_REFUSED: {path}: postcondition {needle!r} count={actual}, expected={count or '>=1'}"
                  )
              print(f"ADMITTED {path}: {needle!r} count={actual}")

          mutant_path = "crates/bcinr-cmca/tests/mutant_kill_g4_cmca.rs"
          mutant = edit(
              mutant_path,
              lambda text: text
                  .replace("gd_ok = gd_ok & (lhs <= rhs);", "gd_ok &= lhs <= rhs;")
                  .replace("normal_ok = normal_ok & (lhs <= rhs);", "normal_ok &= lhs <= rhs;")
                  .replace("inverted_ok = inverted_ok & (lhs > rhs);", "inverted_ok &= lhs > rhs;"),
          )
          require(mutant_path, mutant, "gd_ok &= lhs <= rhs;", 2)
          require(mutant_path, mutant, "normal_ok &= lhs <= rhs;", 1)
          require(mutant_path, mutant, "inverted_ok &= lhs > rhs;", 1)

          trading_path = "crates/bcinr-cmca/tests/usecase_trading_determinism.rs"
          def repair_trading(text: str) -> str:
              text = re.sub(
                  r"    for i in 0\.\.N \{\n        assert_eq!\(\n            results\[0\]\[i\], results\[1\]\[i\],\n            (\"identical market state[^\n]+\"),\n            i\n        \);\n    \}",
                  r"    for (i, (first, second)) in results[0].iter().zip(&results[1]).enumerate() {\n        assert_eq!(\n            first, second,\n            \1,\n            i\n        );\n    }",
                  text,
                  count=1,
              )
              text = re.sub(
                  r"    for i in 0\.\.N \{\n        assert!\(\n            alloc\[i\]\.val > 0,\n            (\"exchange[^\n]+\"),\n            i\n        \);\n        sum \+= alloc\[i\]\.val as u64;\n    \}",
                  r"    for (i, allocation) in alloc.iter().enumerate().take(N) {\n        assert!(\n            allocation.val > 0,\n            \1,\n            i\n        );\n        sum += allocation.val as u64;\n    }",
                  text,
                  count=1,
              )
              text = re.sub(
                  r"        for i in 0\.\.N \{\n            assert!\(\n                alloc\[i\]\.val > 0,\n                (\"round[^\n]+\"),\n                round,\n                i\n            \);\n        \}",
                  r"        for (i, allocation) in alloc.iter().enumerate().take(N) {\n            assert!(\n                allocation.val > 0,\n                \1,\n                round,\n                i\n            );\n        }",
                  text,
                  count=1,
              )
              return text
          trading = edit(trading_path, repair_trading)
          require(trading_path, trading, "results[0].iter().zip(&results[1]).enumerate()", 1)
          require(trading_path, trading, "alloc.iter().enumerate().take(N)", 2)

          consensus_path = "crates/bcinr-powl/tests/usecase_consensus_termination.rs"
          def repair_consensus(text: str) -> str:
              replacements = {
                  "log.record_op_fired(run_id, op_idx, 0).unwrap();":
                      "log.record_op_fired(run_id, op_idx, ticks, 1).unwrap();",
                  "log.record_run_sealed(run_id, op_trace).unwrap();":
                      "log.record_run_sealed(run_id, op_trace, ticks).unwrap();",
                  "log_correct.record_op_fired(run_id, 0, 0).unwrap();":
                      "log_correct.record_op_fired(run_id, 0, 0, 1).unwrap();",
                  "log_correct.record_op_fired(run_id, 1, 0).unwrap();":
                      "log_correct.record_op_fired(run_id, 1, 1, 1).unwrap();",
                  "log_correct.record_op_fired(run_id, 2, 0).unwrap();":
                      "log_correct.record_op_fired(run_id, 2, 2, 1).unwrap();",
                  "log_correct.record_run_sealed(run_id, 0b111).unwrap();":
                      "log_correct.record_run_sealed(run_id, 0b111, 3).unwrap();",
                  "log_reordered.record_op_fired(run_id, 1, 0).unwrap();":
                      "log_reordered.record_op_fired(run_id, 1, 0, 1).unwrap();",
                  "log_reordered.record_op_fired(run_id, 0, 0).unwrap();":
                      "log_reordered.record_op_fired(run_id, 0, 1, 1).unwrap();",
                  "log_reordered.record_op_fired(run_id, 2, 0).unwrap();":
                      "log_reordered.record_op_fired(run_id, 2, 2, 1).unwrap();",
                  "log_reordered.record_run_sealed(run_id, 0b111).unwrap();":
                      "log_reordered.record_run_sealed(run_id, 0b111, 3).unwrap();",
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              return text
          consensus = edit(consensus_path, repair_consensus)
          require(consensus_path, consensus, "record_op_fired(run_id, op_idx, ticks, 1)", 1)
          require(consensus_path, consensus, "record_run_sealed(run_id, op_trace, ticks)", 1)
          if re.search(r"record_op_fired\([^\n]+, 0\)\.unwrap", consensus):
              raise SystemExit(f"REPAIR_REFUSED: {consensus_path}: stale three-argument OCEL call remains")

          react_path = "crates/bcinr-powl/tests/react_file_tree_interview_cmca_chicago.rs"
          def repair_react(text: str) -> str:
              text = re.sub(
                  r"        for &candidate in &self\.candidate_index \{\n            if !self\.covered\.contains\(&candidate\) && candidate == 2 \{\n                return Some\(candidate\);\n            \}\n        \}\n        None",
                  "        self.candidate_index\n            .iter()\n            .find(|&&candidate| !self.covered.contains(&candidate) && candidate == 2)\n            .copied()",
                  text,
                  count=1,
              )
              if "impl Default for CandidateSelector" not in text:
                  marker = "\n// Test harness skeleton"
                  default_impl = "\nimpl Default for CandidateSelector {\n    fn default() -> Self {\n        Self::new()\n    }\n}\n"
                  if text.count(marker) != 1:
                      raise SystemExit(f"REPAIR_REFUSED: {react_path}: test-harness marker drift")
                  text = text.replace(marker, default_impl + marker, 1)
              text = text.replace("let expected_keys = vec![", "let expected_keys = [", 1)
              return text
          react = edit(react_path, repair_react)
          require(react_path, react, "impl Default for CandidateSelector", 1)
          require(react_path, react, ".find(|&&candidate|", 1)
          require(react_path, react, "let expected_keys = [", 1)

          byzantine_path = "crates/bcinr-powl/tests/usecase_swarm_08_byzantine_fault_tolerance.rs"
          def repair_byzantine(text: str) -> str:
              replacement = '''fn test_no_llm_api_calls_in_consensus() {
              let imports = include_str!("usecase_swarm_08_byzantine_fault_tolerance.rs")
                  .lines()
                  .filter(|line| line.trim_start().starts_with("use "))
                  .collect::<Vec<_>>()
                  .join("\\n")
                  .to_ascii_lowercase();
              for forbidden in ["anthropic", "openai", "reqwest", "std::net", "tokio::net"] {
                  assert!(
                      !imports.contains(forbidden),
                      "forbidden LLM/network import found: {}",
                      forbidden
                  );
              }
          }
          '''
              return re.sub(
                  r"fn test_no_llm_api_calls_in_consensus\(\) \{.*?\n\}\s*\Z",
                  replacement,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
          byzantine = edit(byzantine_path, repair_byzantine)
          require(byzantine_path, byzantine, "let imports = include_str!", 1)
          if "assert!(\n        true," in byzantine:
              raise SystemExit(f"REPAIR_REFUSED: {byzantine_path}: vacuous assertion remains")

          verifier_path = "scripts/generate_v26_7_26_report.sh"
          verifier = edit(
              verifier_path,
              lambda text: text
                  .replace(
                      '"cargo bench -p bcinr-pddl --bench phase1_temporal -- --noplot"',
                      '"CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo bench -p bcinr-pddl --bench phase1_temporal -- --noplot"',
                  )
                  .replace(
                      '"cargo bench -p bcinr-powl --bench phase3_scheduler -- --noplot"',
                      '"CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo bench -p bcinr-powl --bench phase3_scheduler -- --noplot"',
                  ),
          )
          require(verifier_path, verifier, "CARGO_PROFILE_BENCH_CODEGEN_UNITS=1 cargo bench", 2)
          PY

          cargo fmt --all
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          allowed=(
            crates/bcinr-cmca/tests/mutant_kill_g4_cmca.rs
            crates/bcinr-cmca/tests/usecase_trading_determinism.rs
            crates/bcinr-powl/tests/react_file_tree_interview_cmca_chicago.rs
            crates/bcinr-powl/tests/usecase_consensus_termination.rs
            crates/bcinr-powl/tests/usecase_swarm_08_byzantine_fault_tolerance.rs
            scripts/generate_v26_7_26_report.sh
          )
          printf 'CHANGED FILES\n%s\n' "${changed[*]}" | tee -a repair.log
          if [[ ${#changed[@]} -ne ${#allowed[@]} ]]; then
            echo "REPAIR_REFUSED: changed-file cardinality mismatch" | tee -a repair.log >&2
            exit 1
          fi
          for expected in "${allowed[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "${expected}" || {
              echo "REPAIR_REFUSED: missing expected change ${expected}" | tee -a repair.log >&2
              exit 1
            }
          done

          git config user.name "BCINR Release Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add -- "${allowed[@]}"
          git commit -m "fix(release): close observed v26.7.26 verifier failures"
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-26-known-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: repair.log
          if-no-files-found: warn
          retention-days: 7
