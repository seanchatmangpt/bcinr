name: v26.7.28 compile
on:
  pull_request:
    branches: [feat/v26.7.28-powl2-multifractal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v26-7-28-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: CMCA authority rail
        run: cargo check -p bcinr-cmca --all-targets --all-features
      - name: External boundary rails
        run: cargo check -p bcinr-pddl -p bcinr-ffi --all-targets --all-features
      - name: Workspace compile
        run: cargo check --workspace --all-targets --all-features
