name: v26.7.28 closure
on:
  pull_request:
    branches: [feat/v26.7.28-powl2-multifractal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v26-7-28-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
      PROPTEST_CASES: "32"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Prepare evidence directory
        run: mkdir -p verification-artifacts
      - name: Build exact ggen CLI source
        shell: bash
        env:
          RUSTFLAGS: ""
        run: |
          set -o pipefail
          cargo install \
            --git https://github.com/seanchatmangpt/ggen \
            --rev ed625aeecce7c412db4a022e67cda5bdc6068083 \
            --bin ggen \
            --locked \
            ggen-cli-lib 2>&1 | tee verification-artifacts/ggen-install.log
      - name: Record exact environment
        run: |
          git rev-parse HEAD | tee verification-artifacts/source-revision.txt
          rustc -Vv | tee verification-artifacts/rust-toolchain.txt
          ggen --version | tee verification-artifacts/ggen-version.txt
      - name: Execute fail-closed closure ladder
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee verification-artifacts/closure.log) 2>&1

          ggen graph validate \
            --files ontology/bcinr.ttl \
            --files ontology/taxonomies.ttl \
            --files ontology/profile.ttl \
            --shapes ontology/shapes.ttl
          ggen sync
          python3 scripts/verify_ggen_receipt.py .ggen-v2/receipt.json
          git diff --exit-code -- \
            crates/bcinr-cmca/src/generated_profile.rs \
            crates/bcinr-guarded/src/powl2_case.rs \
            crates/bcinr-guarded/src/runtime_binding.rs \
            crates/bcinr-guarded/src/taxonomy.rs \
            crates/bcinr-guarded/tests/generated_falsifiers.rs \
            crates/bcinr-powl/src/generated_arity.rs \
            docs/contracts/REFUSAL_LEDGER.md

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --all-targets --no-fail-fast
          cargo run --manifest-path tools/bcinr-contract-gate/Cargo.toml --release --quiet
          cargo run --manifest-path tools/bcinr-cheat-scanner/Cargo.toml --release --quiet
          cargo run --manifest-path tools/ggen/Cargo.toml --release --quiet
          cargo doc --workspace --all-features --no-deps --document-private-items
      - name: Upload exact-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-28-closure-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            verification-artifacts/
            .ggen-v2/receipt.json
            .ggen-v2/receipt-log.jsonl
