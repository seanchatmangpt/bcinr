name: v26.7.28 Temporal Swarm Manufacturer

on:
  push:
    branches:
      - agent/v26.7.28-temporal-swarm
  pull_request:
    branches:
      - main
    paths:
      - crates/bcinr-pddl/**
      - contracts/v26.7.28/**
      - .github/workflows/v26-7-28-temporal-swarm.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v26-7-28-temporal-swarm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manufacture-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout BCINR
        uses: actions/checkout@v4
        with:
          path: bcinr
          fetch-depth: 0

      - name: Checkout ggen manufacturing source
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: agent/v26.7.28-bcinr-runtime-pack
          path: ggen
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Manufacture language-neutral contracts with real ggen
        working-directory: ggen/examples/bcinr-v26-7-28
        shell: bash
        run: |
          set +e
          cargo run --manifest-path ../../Cargo.toml -p ggen-cli-lib --bin ggen -- sync run \
            > /tmp/bcinr-v26-7-28-ggen.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 120 /tmp/bcinr-v26-7-28-ggen.log
            exit "$status"
          fi
          tail -n 30 /tmp/bcinr-v26-7-28-ggen.log

      - name: Project manufactured contracts into BCINR
        run: |
          mkdir -p bcinr/crates/bcinr-pddl/src/generated
          mkdir -p bcinr/contracts/v26.7.28
          cp ggen/examples/bcinr-v26-7-28/generated/temporal_contract.rs \
             bcinr/crates/bcinr-pddl/src/generated/temporal_contract.rs
          cp ggen/examples/bcinr-v26-7-28/generated/swarm_scenarios.rs \
             bcinr/crates/bcinr-pddl/src/generated/swarm_scenarios.rs
          cp ggen/examples/bcinr-v26-7-28/generated/bcinr_temporal.h \
             bcinr/contracts/v26.7.28/bcinr_temporal.h
          cp ggen/examples/bcinr-v26-7-28/generated/bcinr-temporal.wit \
             bcinr/contracts/v26.7.28/bcinr-temporal.wit
          cp ggen/examples/bcinr-v26-7-28/generated/conformance_vectors.json \
             bcinr/contracts/v26.7.28/conformance_vectors.json

      - name: Format source without rewriting generated projections
        working-directory: bcinr
        run: |
          cargo fmt --all
          if ! git diff --quiet -- crates/bcinr-pddl/src/generated; then
            echo "ggen Rust projections are not rustfmt-stable" >&2
            git diff -- crates/bcinr-pddl/src/generated
            exit 1
          fi

      - name: Publish manufactured and formatted bytes to the BCINR branch
        if: github.event_name == 'push'
        working-directory: bcinr
        run: |
          git diff --check
          git add crates/bcinr-pddl contracts/v26.7.28
          if git diff --cached --quiet; then
            echo "manufactured projections and source already match"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore(v26.7.28): materialize and format temporal runtime"
            git push
          fi

      - name: Prove ggen projection identity
        working-directory: ggen/examples/bcinr-v26-7-28
        run: |
          cargo run --manifest-path ../../Cargo.toml -p ggen-cli-lib --bin ggen -- sync run
          git diff --exit-code -- generated
          cmp generated/temporal_contract.rs ../../../bcinr/crates/bcinr-pddl/src/generated/temporal_contract.rs
          cmp generated/swarm_scenarios.rs ../../../bcinr/crates/bcinr-pddl/src/generated/swarm_scenarios.rs
          cmp generated/bcinr_temporal.h ../../../bcinr/contracts/v26.7.28/bcinr_temporal.h
          cmp generated/bcinr-temporal.wit ../../../bcinr/contracts/v26.7.28/bcinr-temporal.wit
          cmp generated/conformance_vectors.json ../../../bcinr/contracts/v26.7.28/conformance_vectors.json

      - name: Refuse LLM dependencies
        working-directory: bcinr
        run: |
          if grep -RniE 'openai|anthropic|ollama|language.model|llm.call' \
            crates/bcinr-pddl/src/temporal_production.rs \
            crates/bcinr-pddl/src/swarm_validation.rs \
            crates/bcinr-pddl/tests/temporal_swarm_v26_7_28.rs \
            crates/bcinr-pddl/tests/manufactured_swarm_scenarios_v26_7_28.rs \
            crates/bcinr-pddl/benches/temporal_swarm_v26_7_28.rs \
            contracts/v26.7.28; then
            echo "LLM dependency detected in deterministic temporal rail" >&2
            exit 1
          fi

      - name: Format
        working-directory: bcinr
        run: cargo fmt --all -- --check

      - name: Compile temporal production rail
        working-directory: bcinr
        run: cargo check -p bcinr-pddl --all-features

      - name: Clippy temporal production rail
        working-directory: bcinr
        run: cargo clippy -p bcinr-pddl --all-targets --all-features -- -D warnings

      - name: Execute temporal PDDL swarm scenarios
        working-directory: bcinr
        run: cargo test -p bcinr-pddl --test temporal_swarm_v26_7_28 -- --nocapture

      - name: Execute all ggen-manufactured swarm scenarios
        working-directory: bcinr
        run: cargo test -p bcinr-pddl --test manufactured_swarm_scenarios_v26_7_28 -- --nocapture

      - name: Compile Divan temporal benchmarks
        working-directory: bcinr
        run: cargo bench -p bcinr-pddl --bench temporal_swarm_v26_7_28 --no-run
