name: Miri

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: Miri UB Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Run Miri
        # The language server is an async filesystem/std I/O orchestration
        # surface and contains no unsafe BCINR kernel. Its admission gates are
        # workspace test, clippy, and documentation; Miri remains focused on
        # the memory-safety-bearing execution substrate.
        run: cargo miri test --workspace --all-features --exclude bcinr-pddl-lsp
