name: v26.7.26 Release Validation

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v26-7-26-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  materialize-release-tree:
    name: Materialize lockfile and rustfmt outputs
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      updated: ${{ steps.materialize.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Materialize tool-owned outputs
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p bcinr-ffi
          cargo fmt --all
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
            : > release-tree.patch
            exit 0
          fi

          printf '%s\n' "${changed[@]}" | tee release-tree-files.txt
          if [[ ${#changed[@]} -gt 40 ]]; then
            echo "REFUSED: formatter/lock materialization changed more than 40 files" >&2
            exit 1
          fi
          for file in "${changed[@]}"; do
            case "${file}" in
              Cargo.lock|*.rs) ;;
              *) echo "REFUSED: unexpected tool-owned output ${file}" >&2; exit 1 ;;
            esac
          done

          git diff --stat
          git diff --binary > release-tree.patch
          git config user.name "BCINR Release Verifier"
          git config user.email "actions@users.noreply.github.com"
          git add -- Cargo.lock '*.rs'
          git commit -m "chore(release): materialize v26.7.26 lock and formatting"
          git push origin HEAD:"${{ github.event.pull_request.head.ref || github.ref_name }}"
          echo "updated=true" >> "${GITHUB_OUTPUT}"
      - name: Upload materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-26-materialized-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Cargo.lock
            release-tree.patch
            release-tree-files.txt
          if-no-files-found: warn
          retention-days: 7

  validate:
    name: Execute release verifier
    needs: materialize-release-tree
    if: needs.materialize-release-tree.outputs.updated != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Validate verifier syntax and source admission
        run: |
          bash -n scripts/generate_v26_7_26_report.sh
          python3 -m py_compile scripts/verify_v26_7_26_structure.py
          python3 scripts/verify_v26_7_26_structure.py --phase all
      - name: Execute all v26.7.26 release rails
        id: verify
        shell: bash
        run: bash scripts/generate_v26_7_26_report.sh
      - name: Publish report to job summary
        if: always()
        shell: bash
        run: |
          report="$(find target/v26.7.26-verification -name v26_7_26_verification_report.md -type f | sort | tail -1)"
          if [[ -n "${report}" && -f "${report}" ]]; then
            cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Release verifier did not produce a report." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
      - name: Upload executable receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-26-release-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/v26.7.26-verification/
          if-no-files-found: error
          retention-days: 30
