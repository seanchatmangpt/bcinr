name: Parser Transform Diagnostic

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: parser-transform-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transformation boundaries
        run: |
          python - <<'PY' | tee parser-transform.log
          from pathlib import Path

          source = Path("crates/bcinr-pddl/src/parse.rs").read_text()

          checks = {
              "condition-start": "fn parse_condition(expr: &SExpr)",
              "condition-end": "\nfn parse_effects(expr: &SExpr)",
              "condition-head": "    let head = list[0].atom()?;\n    match head {",
              "condition-at": '        "at" => {',
              "condition-numeric": '        "increase" | "decrease"',
              "effect-start": "fn parse_effect(expr: &SExpr)",
              "effect-end": "\nfn parse_init(",
              "effect-head": '''    let head = list
                  .first()
                  .ok_or_else(|| Pddl8Error::ParseError("empty effect".into()))?
                  .atom()?;
              match head {''',
              "init-head": "        match list[0].atom()? {",
              "init-at": '            "at" => {',
              "init-not": '            "not" => {',
              "test-anchor": '''    #[test]
              fn preserves_boolean_quantified_and_conditional_trees() {''',
          }
          for name, needle in checks.items():
              print(f"{name}={source.count(needle)}")

          condition_start = source.index(checks["condition-start"])
          condition_end = source.index(checks["condition-end"], condition_start)
          condition = source[condition_start:condition_end]
          print(f"condition-local-at={condition.count(checks['condition-at'])}")
          print(f"condition-local-numeric={condition.count(checks['condition-numeric'])}")

          effect_start = source.index(checks["effect-start"])
          effect_end = source.index(checks["effect-end"], effect_start)
          effect = source[effect_start:effect_end]
          print(f"effect-local-at={effect.count(checks['condition-at'])}")
          print(f"effect-local-numeric={effect.count(checks['condition-numeric'])}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: parser-transform-diagnostic
          path: parser-transform.log
          if-no-files-found: error
