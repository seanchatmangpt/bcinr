[package]
name = "bcinr-pddl-lsp"
version = "26.6.26"
edition = "2021"
repository = "https://github.com/seanchatmangpt/bcinr"
description = "Lifecycle planning language server: PRD/ARD → PDDL8 → bcinr-pddl → receipts → LSP surfaces"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "bcinr-pddl-lsp"
path = "src/main.rs"

[lib]
name = "bcinr_pddl_lsp"
path = "src/lib.rs"

[dependencies]
bcinr-pddl = { path = "../bcinr-pddl" }
wasm4pm-compat = { version = "26.6.28" }
# Pin the LSP law-state runtime and ANDON layer to one admitted upstream
# commit. This removes the former hidden dependency on ../../../lsp-max while
# preserving exact replay across developer machines and CI runners.
lsp-max = { git = "https://github.com/seanchatmangpt/lsp-max", rev = "571bed55009675d44f0c9228e63dabf04d7959b5", features = ["proposed"] }
lsp-types-max = { version = "26.6.24", features = ["proposed"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
