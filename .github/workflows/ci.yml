                          continue;
                      }
                  }
                  match head {
                      "=" => {'''))

          replacements.append((
          '''            "at" => {
                          if list.len() != 3 {
                              return Err(Pddl8Error::ParseError(
                                  "timed initial literal requires time and literal".into(),
                              ));
                          }
