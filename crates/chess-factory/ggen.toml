# =============================================================================
# GGEN Chess Factory — manufacturing manifest.
#
# `ggen sync` loads ontology/chess.ttl, runs each rule's SPARQL SELECT over the
# graph, renders the rule's Tera template with the result rows, and writes the
# result to output_file. Generated source under src/ is committed as FIRST-CLASS
# source (GGEN-SRC law): no generated/ paths, no DO-NOT-EDIT banners. Edit the
# TTL and re-run `ggen sync`; never hand-edit output.
#
# FANOUT: when output_file contains a "{{var}}" placeholder, ggen renders the
# template ONCE PER ROW with that row's scalars bound directly in context, and
# substitutes the placeholder per row (e.g. src/stations/{{name}}.rs ->
# src/stations/material.rs, ...). When output_file is static, ggen renders ONCE
# with the full row list bound as `sparql_results`.
#
# PROVISION LAW: every {{row.X}} a template uses MUST be a column its paired
# SELECT projects (GGEN-TPL-001); every SELECT ends with ORDER BY a stable key
# (determinism).
# =============================================================================

[project]
name = "chess-factory"
version = "0.1.0"
description = "Branchless chess decision stations manufactured from semantic law"

[ontology]
source = "ontology/chess.ttl"
# Import the RESULTS graph so the proof_table rule can render the receipt-cited
# Crown matrix in the same `ggen sync` pass. results.ttl is emitted from the
# empirical benchmark artifacts (artifacts/benchmark.receipt.json + elo_curve.json)
# by tools/emit_results_ttl.py — re-emit it after each benchmark run, then sync.
imports = ["artifacts/results.ttl"]
base_iri = "https://bcinr.dev/chess-factory/ontology#"

[ontology.prefixes]
cf   = "https://bcinr.dev/chess-factory/ontology#"
rdf  = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs = "http://www.w3.org/2000/01/rdf-schema#"
xsd  = "http://www.w3.org/2001/XMLSchema#"

[inference]
# A single idempotent CONSTRUCT that materializes a marker triple per evaluation
# cell (cf:isManufacturedCell true). It enriches the graph without perturbing any
# SELECT projection, and satisfies the DMAIC "measurement system capability" gate
# which requires at least one non-empty CONSTRUCT inference rule.
[[inference.rules]]
name = "mark_manufactured_cells"
description = "Tag every FeatureStation and TacticalMotif as a manufactured cell."
order = 0
construct = """
PREFIX cf: <https://bcinr.dev/chess-factory/ontology#>
CONSTRUCT { ?cell cf:isManufacturedCell true . }
WHERE {
  { ?cell a cf:FeatureStation . }
  UNION
  { ?cell a cf:TacticalMotif . }
}
"""

[generation]
output_dir = "."

# ---------------------------------------------------------------------------
# Rule: feature_stations  (FANOUT -> one file per station)
#   queries/feature_stations.rq -> templates/feature_station.rs.tera
#   -> src/stations/{{name}}.rs
# ---------------------------------------------------------------------------
[[generation.rules]]
name = "feature_stations"
query = { file = "queries/feature_stations.rq" }
template = { file = "templates/feature_station.rs.tera" }
output_file = "src/stations/{{name}}.rs"
mode = "Overwrite"

# ---------------------------------------------------------------------------
# Rule: stations_mod  (STATIC -> registry module)
#   queries/station_index.rq -> templates/stations_mod.rs.tera
#   -> src/stations/mod.rs
# ---------------------------------------------------------------------------
[[generation.rules]]
name = "stations_mod"
query = { file = "queries/station_index.rq" }
template = { file = "templates/stations_mod.rs.tera" }
output_file = "src/stations/mod.rs"
mode = "Overwrite"

