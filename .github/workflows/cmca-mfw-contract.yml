name: CMCA to MFW exact-head contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Validate vendored compatibility boundary
        run: cargo clippy -p encode_unicode --all-targets --all-features -- -D warnings
      - name: Execute non-mutant CMCA baseline
        run: cargo test -p bcinr-cmca --features std
      - name: Execute CMCA to MFW mass bridge
        run: cargo test -p bcinr-cmca --features std --test mfw_mass_bridge_contract
      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
