name: Branch Manufacture

on:
  push:
    branches:
      - agent/v26.7.24-production-pddl-powl-v2

permissions:
  contents: write

jobs:
  manufacture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v26.7.24-production-pddl-powl-v2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Apply admitted mechanical repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/bcinr-pddl/src/ground_v2.rs')
          text = path.read_text()

          anchor = '''fn apply_action(
          '''
          helper = '''fn enumerate_bindings_result<F>(
              variables: &[(String, String)],
              candidates: &[Vec<String>],
              index: usize,
              binding: &mut BTreeMap<String, String>,
              callback: &mut F,
          ) -> Result<(), ExactClassicalError>
          where
              F: FnMut(&BTreeMap<String, String>) -> Result<(), ExactClassicalError>,
          {
              if index == variables.len() {
                  return callback(binding);
              }
              let variable = &variables[index].0;
              for object in &candidates[index] {
                  binding.insert(variable.clone(), object.clone());
                  enumerate_bindings_result(
                      variables,
                      candidates,
                      index + 1,
                      binding,
                      callback,
                  )?;
                  binding.remove(variable);
              }
              Ok(())
          }

          fn apply_action(
          '''
          if 'fn enumerate_bindings_result<' not in text:
              if anchor not in text:
                  raise SystemExit('ground_v2 helper insertion anchor missing')
              text = text.replace(anchor, helper, 1)

          old = '''            enumerate_bindings(vars, &candidates, 0, &mut BTreeMap::new(), &mut |binding| {
                          for nested in effects {
                              let grounded = subst_effect(nested, binding);
                              // Scope validation has already removed every error except
                              // numeric conflicts/division, which are handled after this
                              // enumeration. Collection errors are impossible here.
                              collect_effect(&grounded, state, objects, type_index, delta)
                                  .expect("validated quantified effect");
                          }
                      });
          '''
          new = '''            enumerate_bindings_result(
                          vars,
                          &candidates,
                          0,
                          &mut BTreeMap::new(),
                          &mut |binding| {
                              for nested in effects {
                                  let grounded = subst_effect(nested, binding);
                                  collect_effect(&grounded, state, objects, type_index, delta)?;
                              }
                              Ok(())
                          },
                      )?;
          '''
          if old in text:
              text = text.replace(old, new, 1)

          replacements = {
              'assert_eq!(solve(domain, locked), Err(ExactClassicalError::NoPlan));':
                  'assert!(matches!(solve(domain, locked), Err(ExactClassicalError::NoPlan)));',
              'assert_eq!(solve(domain, problem), Err(ExactClassicalError::NoPlan));':
                  'assert!(matches!(solve(domain, problem), Err(ExactClassicalError::NoPlan)));',
              'assert_eq!(solve(domain, insufficient), Err(ExactClassicalError::NoPlan));':
                  'assert!(matches!(solve(domain, insufficient), Err(ExactClassicalError::NoPlan)));',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)
          PY
          cargo fmt --all
          if git diff --quiet; then
            echo 'manufacture: no changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git commit -m 'fix: apply verifier-driven production repairs'
          git push origin HEAD:agent/v26.7.24-production-pddl-powl-v2
