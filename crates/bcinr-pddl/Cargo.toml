[package]
name = "bcinr-pddl"
version = "26.7.25"
edition = "2021"
description = "PDDL 3.1 admission → planning → POWL projection → OCEL/BLAKE3 receipts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/bcinr"
keywords = ["pddl", "planning", "workflow", "prolog", "receipt"]
categories = ["algorithms"]
readme = "../../README.md"

# The PDDL syntax reader is implemented in-crate. No third-party PDDL parser
# or parser license is part of the production dependency graph.

[dependencies]
# BLAKE3 for receipt chaining
blake3 = "1"
# Prolog8 kernel — admission gate (R ⊢ A).
prolog8 = { version = "26.6.25" }
# Canonical OCEL and PDDL transport types. Upgrade to 26.7.24 after the
# quick-xml security release is published; see wasm4pm-compat PR #6.
wasm4pm-compat = { version = "26.6.29" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Shared multifractal planning IR. This edge is one-way.
bcinr-mfw-ir = { path = "../bcinr-mfw-ir", version = "26.7.25" }
# Optional POWL execution/proof path.
bcinr-powl = { path = "../bcinr-powl", version = "26.7.25", optional = true }
bcinr-powl-receipt = { path = "../bcinr-powl-receipt", version = "26.7.25", optional = true }

[features]
dhat-heap = []
mfw-planner = ["dep:bcinr-powl", "dep:bcinr-powl-receipt"]

[dev-dependencies]
chicago-tdd-tools = { version = "26.7.1", features = ["ocel-generation"] }
divan = "0.1.21"
proptest = "1"

[[test]]
name = "logistics"
path = "tests/logistics.rs"

[[test]]
name = "brce_loop"
path = "tests/brce_loop.rs"

[[test]]
name = "vision2030"
path = "tests/vision2030.rs"

[[example]]
name = "dfcm_alloc_profile"
required-features = ["dhat-heap"]

[[example]]
name = "pddl_to_powl"
required-features = ["mfw-planner"]

[[example]]
name = "embedded_workflow"
required-features = ["mfw-planner"]

[[example]]
name = "planning_native_application"
required-features = ["mfw-planner"]

[[test]]
name = "indexed_grounding"
path = "tests/indexed_grounding.rs"

[[test]]
name = "gate_g5_integration_test"
path = "tests/gate_g5_integration_test.rs"
required-features = ["mfw-planner"]

[[test]]
name = "mutant_kill_g4"
path = "tests/mutant_kill_g4.rs"
required-features = ["mfw-planner"]

[[test]]
name = "temporal_swarm_v26_7_28"
path = "tests/temporal_swarm_v26_7_28.rs"

[[test]]
name = "manufactured_swarm_scenarios_v26_7_28"
path = "tests/manufactured_swarm_scenarios_v26_7_28.rs"

[[bench]]
name = "pddl_80_20"
path = "benches/pddl_80_20.rs"
harness = false

[[bench]]
name = "scaling"
path = "benches/scaling.rs"
harness = false

[[bench]]
name = "temporal_swarm_v26_7_28"
path = "benches/temporal_swarm_v26_7_28.rs"
harness = false
