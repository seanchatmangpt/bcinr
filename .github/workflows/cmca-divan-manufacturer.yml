name: CMCA Divan Manufacturer

on:
  push:
    branches:
      - agent/cmca-divan-execution-benchmarks
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cmca-divan-manufacturer-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manufacture:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install repository toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cmca-divan

      - name: Canonical formatting
        run: cargo fmt --all

      - name: Compile CMCA Divan target
        run: cargo check -p bcinr-bench --bench cmca_execution_bench

      - name: Commit normalized source and lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock bcinr-bench/Cargo.toml bcinr-bench/benches/cmca_execution_bench.rs
          if git diff --cached --quiet; then
            echo 'No normalization changes to commit.'
          else
            git commit -m 'bench(cmca): normalize Divan execution suite'
            git push
          fi

      - name: Lint CMCA Divan target
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p bcinr-bench --bench cmca_execution_bench -- -D warnings 2>&1 | tee /tmp/cmca-divan-clippy.txt

      - name: Persist Clippy diagnostic
        if: steps.clippy.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/testing
          {
            echo '# CMCA Divan Clippy Diagnostic'
            echo
            echo '- Workflow run: `${{ github.run_id }}`'
            echo '- Source commit: `${{ github.sha }}`'
            echo
            echo '```text'
            cat /tmp/cmca-divan-clippy.txt
            echo '```'
          } > docs/testing/cmca-divan-clippy-diagnostic.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/testing/cmca-divan-clippy-diagnostic.md
          git commit -m 'test(cmca): receipt Divan Clippy diagnostic'
          git push

      - name: Enforce Clippy result
        if: steps.clippy.outcome == 'failure'
        run: exit 1

      - name: Execute CMCA Divan baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/testing
          cargo bench -p bcinr-bench --bench cmca_execution_bench 2>&1 | tee /tmp/cmca-divan-output.txt
          {
            echo '# CMCA Divan Execution Baseline — v26.7.25'
            echo
            echo '- Workflow run: `${{ github.run_id }}`'
            echo '- Source commit: `${{ github.sha }}`'
            echo '- Runner: `ubuntu-latest`'
            echo '- Kernel: `'
            uname -a
            echo '`'
            echo '- Rust toolchain:'
            echo '```text'
            rustc -Vv
            echo '```'
            echo
            echo '## Command'
            echo
            echo '```bash'
            echo 'cargo bench -p bcinr-bench --bench cmca_execution_bench'
            echo '```'
            echo
            echo '## Divan output'
            echo
            echo '```text'
            cat /tmp/cmca-divan-output.txt
            echo '```'
          } > docs/testing/cmca-divan-execution-v26.7.25.md

      - name: Commit benchmark receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/testing/cmca-divan-execution-v26.7.25.md
          if git diff --cached --quiet; then
            echo 'No benchmark receipt to commit.'
          else
            git commit -m 'bench(cmca): receipt Divan execution baseline'
            git push
          fi

  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install repository toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cmca-divan

      - name: Compile CMCA Divan target
        run: cargo check -p bcinr-bench --bench cmca_execution_bench

      - name: Lint CMCA Divan target
        id: verify_clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p bcinr-bench --bench cmca_execution_bench -- -D warnings 2>&1 | tee cmca-divan-clippy.txt

      - name: Upload Clippy diagnostic
        if: steps.verify_clippy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cmca-divan-clippy-${{ github.run_id }}
          path: cmca-divan-clippy.txt
          if-no-files-found: error

      - name: Enforce Clippy result
        if: steps.verify_clippy.outcome == 'failure'
        run: exit 1

      - name: Execute CMCA Divan baseline
        run: cargo bench -p bcinr-bench --bench cmca_execution_bench
