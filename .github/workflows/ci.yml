name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ubuntu-nightly
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Critical behavioral proof (5s max)
        run: >-
          timeout --signal=KILL 5s
          cargo test
          -p bcinr-pddl
          --test embedded_workflow_generated
          --all-features
          -- --test-threads=1

  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ runner.os }}-nightly
          cache-on-failure: true
      - name: Check production composition crates
        run: >-
          cargo check
          -p bcinr-mfw-ir
          -p bcinr-pddl
          -p bcinr-powl
          -p bcinr-powl-receipt
          --all-features
          --tests
