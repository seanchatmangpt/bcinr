name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  style:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Capture formatting diff
        id: formatting
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo fmt --all -- --check > rustfmt.patch 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat rustfmt.patch
          exit 0
      - name: Upload formatting refusal
        if: steps.formatting.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
      - name: Enforce formatting
        if: steps.formatting.outputs.status != '0'
        run: exit 1
      - name: Capture Clippy diagnostics
        id: clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings > clippy.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat clippy.log
          exit 0
      - name: Upload Clippy refusal
        if: steps.clippy.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: error
      - name: Enforce Clippy
        if: steps.clippy.outputs.status != '0'
        run: exit 1

  canonical:
    name: PDDL & POWL Canonical Conformance
    needs: [style]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Capture canonical IPC diagnostics
        id: canonical_ipc
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test -p bcinr-pddl --all-features --test canonical_ipc > canonical-ipc.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat canonical-ipc.log
          exit 0
      - name: Upload canonical IPC refusal
        if: steps.canonical_ipc.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ipc-diagnostics
          path: canonical-ipc.log
          if-no-files-found: error
      - name: Enforce canonical IPC fixtures
        if: steps.canonical_ipc.outputs.status != '0'
        run: exit 1
      - name: Exact classical PDDL semantics
        run: cargo test -p bcinr-pddl --all-features ground_v2
      - name: POWL 2.0 model, compiler, and scheduler
        run: cargo test -p bcinr-powl --all-features powl2
      - name: Planner-output POWL v2 execution bridge
        run: cargo test -p bcinr-powl --all-features scheduler_v2
      - name: POWL v2 execution receipt and replay
        run: cargo test -p bcinr-powl-receipt --all-features execution_v2
      - name: Production cognitive composition rail
        run: cargo test -p bcinr-pddl --all-features production

  test:
    name: Test (${{ matrix.os }} / nightly)
    needs: [style]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --all-features --all-targets --no-fail-fast
        shell: bash

  security:
    name: Security & Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install security tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Security audit
        run: cargo audit
      - name: License and source policy
        run: cargo deny check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
