name: v26.7.28 compile
on:
  pull_request:
    branches: [feat/v26.7.28-powl2-multifractal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v26-7-28-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Materialize rustfmt patch
        run: |
          mkdir -p verification-artifacts
          cargo fmt --all
          git diff --binary > verification-artifacts/rustfmt.patch
      - name: CMCA authority rail
        shell: bash
        run: |
          set -o pipefail
          cargo check -p bcinr-cmca --all-targets --all-features 2>&1 | tee verification-artifacts/cmca-check.log
      - name: External boundary rails
        shell: bash
        run: |
          set -o pipefail
          cargo check -p bcinr-pddl -p bcinr-ffi --all-targets --all-features 2>&1 | tee verification-artifacts/external-check.log
      - name: Workspace compile
        shell: bash
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --all-features 2>&1 | tee verification-artifacts/workspace-check.log
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-28-compile-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: verification-artifacts/
