[package]
name = "bcinr-cmca"
version = "26.7.28"
edition = "2021"
description = "CMCA-RDF deterministic substrate crate"
license = "MIT OR Apache-2.0"
rust-version = "1.70"
repository = "https://github.com/seanchatmangpt/bcinr"
keywords = ["cmca", "rdf", "deterministic", "algorithms"]
categories = ["algorithms"]
readme = "../../README.md"
# Workspace-internal: depends on bcinr-logic by exact path+version, and
# currently contains unexported/unverified code (see lib.rs's "INTEGRATION
# NOTE (v26.7.24)" on the allocator authority subsystem, pending formal
# Hoare-logic verification) not meant for external consumption yet.
publish = false

[dependencies]
bcinr-logic = { path = "../bcinr-logic", version = "26.7.28" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chicago-tdd-tools = { version = "26.7.1", features = ["ocel-generation"] }
trybuild = "1.0"
proptest = "1.2.0"

[features]
default = []
alloc = []
std = ["bcinr-logic/std", "alloc"]
mutant_1 = []
mutant_2 = []
mutant_3 = []
mutant_4 = []
mutant_5 = []
mutant_6 = []
mutant_7 = []
mutant_8 = []
mutant_9 = []
mutant_10 = []
mutant_11 = []
[lib]
crate-type = ["rlib"]
