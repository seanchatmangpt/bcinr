[package]
name = "bcinr-bench"
version = "26.6.24"
edition = "2021"
description = "BranchlessCInRust: Academic-grade branchless algorithm library"
repository = "https://github.com/example/bcinr"
license = "MIT OR Apache-2.0"
rust-version = "1.70"
keywords = ["branchless", "simd", "performance"]
categories = ["algorithms", "no-std"]
publish = false

readme = "../README.md"
[dependencies]
criterion = "0.5"
divan = "0.1"
bcinr-core = { path = "../bcinr-core", version = "26.6.24" }
bcinr-logic = { path = "../crates/bcinr-logic", version = "26.6.24", features = ["bench", "alloc"] }
bcinr-pddl = { path = "../crates/bcinr-pddl" }
prettytable-rs = "0.10.0"

[features]
alloc = ["bcinr-logic/alloc"]
bench = ["bcinr-logic/bench"]

[[bench]]
name = "bcinr_bench"
harness = false

[[bench]]
name = "all_300_bench"
harness = false

[[bench]]
name = "algorithms_101_200"
harness = false

[[bench]]
name = "patterns_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false

[[bench]]
name = "fix_bench"
harness = false

[[bench]]
name = "pddl_quick_bench"
harness = false

[[bench]]
name = "logic_dfa_swar_bench"
harness = false

[[bench]]
name = "dfcm_crown_bench"
harness = false

[[example]]
name = "timing"
