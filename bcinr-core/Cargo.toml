[package]
name = "bcinr-core"
version = "26.4.22"
edition = "2021"
description = "BranchlessCInRust: Academic-grade branchless algorithm library"
repository = "https://github.com/example/bcinr"
license = "MIT OR Apache-2.0"
rust-version = "1.70"
keywords = ["branchless", "simd", "performance"]
categories = ["algorithms", "no-std"]

readme = "../README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "src/**/*",
    "benches/**/*",
    "../README.md",
    "../CONTRACT.md",
    "../HOARE_TRIPLES.md",
    "../COMMAND_TRANSCRIPT.md",
    "../MUTANT_KILL_MATRIX.md",
    "../OBJECT_CODE_AUDIT.md",
    "../RELEASE_NOTES.md",
    "../docs/contracts/HOARE_TRIPLES.md",
    "../docs/contracts/PDDL_CONTRACT.md",
    "../docs/contracts/POWL_CONTRACT.md",
    "../docs/contracts/CMCA_CONTRACT.md",
    "../docs/gates/ORACLE_INDEPENDENCE.md"
]

[dependencies]
bcinr-api = { path = "../crates/bcinr-api", version = "26.4.22" }
bcinr-logic = { path = "../crates/bcinr-logic", version = "26.4.22" }

[features]
default = []
alloc = []
std = []
bench = []

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "kernel_bench"
harness = false
