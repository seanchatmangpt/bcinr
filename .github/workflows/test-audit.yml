name: Test Audit

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: test-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  audit:
    name: Inventory and time all test binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-audit-ubuntu-nightly
          cache-on-failure: true

      - name: Inventory test sources
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'path\trust_tests\tchicago_tests\tignored\tproptest_blocks\n'
            while IFS= read -r path; do
              rust_tests="$(grep -Ec '#\[(tokio::)?test([^]]*)?\]' "$path" || true)"
              chicago_tests="$(grep -Ec 'chicago_tdd_tools::test!' "$path" || true)"
              ignored="$(grep -Ec '#\[ignore([^]]*)?\]' "$path" || true)"
              proptest_blocks="$(grep -Ec 'proptest!' "$path" || true)"
              if [ "$rust_tests" -gt 0 ] || [ "$chicago_tests" -gt 0 ] || [ "$ignored" -gt 0 ] || [ "$proptest_blocks" -gt 0 ]; then
                printf '%s\t%s\t%s\t%s\t%s\n' "$path" "$rust_tests" "$chicago_tests" "$ignored" "$proptest_blocks"
              fi
            done < <(find . -type f -name '*.rs' -not -path './target/*' -not -path './.git/*' | sort)
          } | tee test-source-inventory.tsv

      - name: Build every unit and integration test target
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --workspace \
            --all-features \
            --lib \
            --tests \
            --no-run \
            --message-format=json-render-diagnostics \
            > cargo-test-build.jsonl

      - name: Enumerate and time every compiled test binary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time

          BUDGET_SECONDS = 5

          def text(value):
              if value is None:
                  return ''
              if isinstance(value, bytes):
                  return value.decode(errors='replace')
              return value

          records = {}
          with open('cargo-test-build.jsonl', encoding='utf-8') as stream:
              for line in stream:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('reason') != 'compiler-artifact':
                      continue
                  profile = event.get('profile') or {}
                  executable = event.get('executable')
                  target = event.get('target') or {}
                  if not profile.get('test') or not executable:
                      continue
                  executable = os.path.realpath(executable)
                  records[executable] = {
                      'package': (event.get('package_id') or '').split(' ')[0],
                      'target': target.get('name', ''),
                      'kind': ','.join(target.get('kind') or []),
                      'src_path': target.get('src_path', ''),
                  }

          rows = []
          listings = []
          pathlib.Path('test-logs').mkdir(exist_ok=True)
          for executable, metadata in sorted(
              records.items(),
              key=lambda item: (item[1]['package'], item[1]['target'], item[0]),
          ):
              try:
                  listing = subprocess.run(
                      [executable, '--list', '--format', 'terse'],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=BUDGET_SECONDS,
                      check=False,
                  )
                  listing_output = listing.stdout
                  tests = [
                      line
                      for line in listing_output.splitlines()
                      if line.endswith(': test')
                  ]
                  list_status = str(listing.returncode)
              except subprocess.TimeoutExpired as exc:
                  listing_output = text(exc.stdout) + text(exc.stderr)
                  tests = []
                  list_status = 'LIST_TIMEOUT_5S'
              except OSError as exc:
                  listing_output = str(exc)
                  tests = []
                  list_status = f'LIST_OS_ERROR_{exc.errno}'
              listings.append((metadata, listing_output))

              started = time.monotonic_ns()
              try:
                  run = subprocess.run(
                      [executable, '--test-threads=1'],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=BUDGET_SECONDS,
                      check=False,
                  )
                  status = str(run.returncode)
                  output = run.stdout
              except subprocess.TimeoutExpired as exc:
                  status = 'TIMEOUT_5S'
                  output = text(exc.stdout) + text(exc.stderr)
              except OSError as exc:
                  status = f'OS_ERROR_{exc.errno}'
                  output = str(exc)
              elapsed_ms = (time.monotonic_ns() - started) // 1_000_000

              log_name = (
                  f"{metadata['package']}__{metadata['target']}.log"
                  .replace('/', '_')
              )
              pathlib.Path('test-logs', log_name).write_text(
                  output,
                  encoding='utf-8',
              )

              row = {
                  **metadata,
                  'test_count': len(tests),
                  'list_status': list_status,
                  'elapsed_ms': elapsed_ms,
                  'status': status,
                  'budget_class': (
                      'fast'
                      if status == '0' and elapsed_ms <= BUDGET_SECONDS * 1000
                      else 'trim'
                  ),
                  'executable': executable,
              }
              rows.append(row)
              print(
                  f"{row['package']}\t{row['target']}\t{row['test_count']}\t"
                  f"{row['elapsed_ms']}\t{row['status']}\t{row['budget_class']}",
                  flush=True,
              )

          columns = [
              'package',
              'target',
              'kind',
              'src_path',
              'test_count',
              'list_status',
              'elapsed_ms',
              'status',
              'budget_class',
              'executable',
          ]
          with open('test-runtime.tsv', 'w', encoding='utf-8') as out:
              out.write('\t'.join(columns) + '\n')
              for row in rows:
                  out.write('\t'.join(str(row[column]) for column in columns) + '\n')

          with open('test-list.txt', 'w', encoding='utf-8') as out:
              for metadata, listing_output in listings:
                  out.write(
                      f"## {metadata['package']} :: {metadata['target']} :: "
                      f"{metadata['src_path']}\n"
                  )
                  out.write(listing_output)
                  out.write('\n')

          fast = [row for row in rows if row['budget_class'] == 'fast']
          trimmed = [row for row in rows if row['budget_class'] == 'trim']
          with open('test-audit-summary.md', 'w', encoding='utf-8') as out:
              out.write('# Workspace test audit\n\n')
              out.write(f'- Compiled test binaries: {len(rows)}\n')
              out.write(f'- Within 5-second budget: {len(fast)}\n')
              out.write(f'- Failed or over budget: {len(trimmed)}\n\n')
              out.write('| Package | Target | Tests | Runtime ms | Status | Tier |\n')
              out.write('|---|---|---:|---:|---|---|\n')
              for row in sorted(
                  rows,
                  key=lambda row: row['elapsed_ms'],
                  reverse=True,
              ):
                  out.write(
                      f"| {row['package']} | {row['target']} | "
                      f"{row['test_count']} | {row['elapsed_ms']} | "
                      f"{row['status']} | {row['budget_class']} |\n"
                  )
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-audit
          path: |
            test-source-inventory.tsv
            test-runtime.tsv
            test-list.txt
            test-audit-summary.md
            test-logs/
          if-no-files-found: warn
          retention-days: 7
