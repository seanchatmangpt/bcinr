name: CMCA Divan Isolated Verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install repository toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cmca-divan-ephemeral-runner

      - name: Manufacture independent CMCA benchmark crate
        shell: bash
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/cmca-divan-runner"
          mkdir -p "$runner/benches"
          cp bcinr-bench/benches/cmca_execution_bench.rs \
            "$runner/benches/cmca_execution_bench.rs"
          cat > "$runner/Cargo.toml" <<EOF
          [package]
          name = "cmca-divan-runner"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          bcinr-cmca = { path = "$GITHUB_WORKSPACE/crates/bcinr-cmca" }
          divan = "0.1"

          [[bench]]
          name = "cmca_execution_bench"
          harness = false

          [workspace]
          EOF

      - name: Compile independent CMCA Divan target
        run: cargo check --manifest-path "$RUNNER_TEMP/cmca-divan-runner/Cargo.toml" --bench cmca_execution_bench

      - name: Lint independent CMCA Divan target
        run: cargo clippy --manifest-path "$RUNNER_TEMP/cmca-divan-runner/Cargo.toml" --bench cmca_execution_bench -- -D warnings

      - name: Execute independent CMCA Divan baseline
        id: bench
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo bench --manifest-path "$RUNNER_TEMP/cmca-divan-runner/Cargo.toml" --bench cmca_execution_bench 2>&1 | tee cmca-divan-isolated-output.txt

      - name: Upload complete Divan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmca-divan-isolated-${{ github.run_id }}
          path: cmca-divan-isolated-output.txt
          if-no-files-found: error

      - name: Enforce benchmark result
        if: steps.bench.outcome == 'failure'
        run: exit 1
