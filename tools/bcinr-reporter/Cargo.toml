[package]
name = "bcinr-reporter"
version = "26.9.15"
edition = "2021"

license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/bcinr"
description = "Audits bcinr-logic substrate integrity: runs every module's integrity check, tabulates the pass/fail execution matrix, and reports U64-contract coverage."
readme = "../../README.md"
[dependencies]
prettytable-rs = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
