name: Test Audit

on:
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

jobs:
  audit:
    name: Measure test binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      report: ${{ steps.classify.outputs.report }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-audit-ubuntu-nightly
          cache-on-failure: true

      - name: Inventory test sources
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'path\trust_tests\tchicago_tests\tignored\tproptest_blocks\n'
            while IFS= read -r path; do
              rust_tests="$(grep -Ec '#\[(tokio::)?test([^]]*)?\]' "$path" || true)"
              chicago_tests="$(grep -Ec 'chicago_tdd_tools::test!' "$path" || true)"
              ignored="$(grep -Ec '#\[ignore([^]]*)?\]' "$path" || true)"
              proptest_blocks="$(grep -Ec 'proptest!' "$path" || true)"
              if [ "$rust_tests" -gt 0 ] || [ "$chicago_tests" -gt 0 ] || [ "$ignored" -gt 0 ] || [ "$proptest_blocks" -gt 0 ]; then
                printf '%s\t%s\t%s\t%s\t%s\n' "$path" "$rust_tests" "$chicago_tests" "$ignored" "$proptest_blocks"
              fi
            done < <(find . -type f -name '*.rs' -not -path './target/*' -not -path './.git/*' | sort)
          } > test-source-inventory.tsv

      - name: Build every unit and integration test target
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --workspace \
            --all-features \
            --lib \
            --tests \
            --no-run \
            --message-format=json-render-diagnostics \
            > cargo-test-build.jsonl \
            2> cargo-test-build.stderr

      - name: Classify compiled test binaries
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          budget_seconds = 5
          records = {}
          with open('cargo-test-build.jsonl', encoding='utf-8') as stream:
              for line in stream:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('reason') != 'compiler-artifact':
                      continue
                  profile = event.get('profile') or {}
                  executable = event.get('executable')
                  target = event.get('target') or {}
                  if profile.get('test') and executable:
                      records[os.path.realpath(executable)] = {
                          'package': (event.get('package_id') or '').split(' ')[0],
                          'target': target.get('name', ''),
                          'kind': ','.join(target.get('kind') or []),
                          'src_path': target.get('src_path', ''),
                      }

          rows = []
          for executable, metadata in sorted(
              records.items(),
              key=lambda item: (item[1]['package'], item[1]['target'], item[0]),
          ):
              try:
                  listing = subprocess.run(
                      [executable, '--list', '--format', 'terse'],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      timeout=budget_seconds,
                      check=False,
                  )
                  tests = [line for line in listing.stdout.splitlines() if line.endswith(': test')]
                  list_status = str(listing.returncode)
              except subprocess.TimeoutExpired:
                  tests = []
                  list_status = 'LIST_TIMEOUT_5S'
              except OSError as exc:
                  tests = []
                  list_status = f'LIST_OS_ERROR_{exc.errno}'

              started = time.monotonic_ns()
              try:
                  run = subprocess.run(
                      [executable, '--test-threads=1'],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=budget_seconds,
                      check=False,
                  )
                  status = str(run.returncode)
              except subprocess.TimeoutExpired:
                  status = 'TIMEOUT_5S'
              except OSError as exc:
                  status = f'OS_ERROR_{exc.errno}'
              elapsed_ms = (time.monotonic_ns() - started) // 1_000_000

              rows.append({
                  **metadata,
                  'test_count': len(tests),
                  'list_status': list_status,
                  'elapsed_ms': elapsed_ms,
                  'status': status,
                  'tier': 'fast' if status == '0' and elapsed_ms <= 5000 else 'trim',
              })

          columns = [
              'package', 'target', 'kind', 'src_path', 'test_count',
              'list_status', 'elapsed_ms', 'status', 'tier',
          ]
          rows.sort(key=lambda row: row['elapsed_ms'], reverse=True)
          fast = sum(row['tier'] == 'fast' for row in rows)

          report = []
          report.append('=== TEST_AUDIT_SUMMARY ===')
          report.append(f'compiled_test_binaries={len(rows)}')
          report.append(f'within_5s_budget={fast}')
          report.append(f'failed_or_over_budget={len(rows) - fast}')
          report.append('=== TEST_RUNTIME_TSV ===')
          report.append('\t'.join(columns))
          report.extend('\t'.join(str(row[column]) for column in columns) for row in rows)
          report.append('=== TEST_SOURCE_INVENTORY_TSV ===')
          report.extend(open('test-source-inventory.tsv', encoding='utf-8').read().splitlines())

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('report<<TEST_AUDIT_EOF\n')
              out.write('\n'.join(report))
              out.write('\nTEST_AUDIT_EOF\n')
          PY

  report:
    name: Test audit receipt
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Emit receipt
        shell: bash
        env:
          TEST_AUDIT_REPORT: ${{ needs.audit.outputs.report }}
        run: printf '%s\n' "$TEST_AUDIT_REPORT"
