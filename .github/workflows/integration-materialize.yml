name: Integration Materialize

on:
  push:
    branches:
      - agent/semantic-three-way-integration-v26.7.24
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-three-way-integration-v26.7.24
          fetch-depth: 0
      - name: Verify integration graph
        run: |
          set -euxo pipefail
          git log -1 --format='%H %P %s'
          git cat-file -e 3338f59ae5fd11f0f5e05115e2981f6daa8caef2^{commit}
          git cat-file -e 22945aff08f0d0194febec924c93c5f6a192a942^{commit}
          git cat-file -e 8e80292a425207636628c6a489bb9a11c6092208^{commit}
      - name: Archive complete merge basis trees
        run: |
          set -euxo pipefail
          mkdir -p basis/base basis/main
          git archive 3338f59ae5fd11f0f5e05115e2981f6daa8caef2 | tar -x -C basis/base
          git archive 22945aff08f0d0194febec924c93c5f6a192a942 | tar -x -C basis/main
          tar -czf bcinr-merge-basis.tar.gz basis
          ls -lh bcinr-merge-basis.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bcinr-complete-merge-basis
          path: bcinr-merge-basis.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
