[package]
name = "bcinr-bench"
version = "26.7.25"
edition = "2021"
description = "BranchlessCInRust: Academic-grade branchless algorithm library"
repository = "https://github.com/example/bcinr"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
keywords = ["branchless", "simd", "performance"]
categories = ["algorithms", "no-std"]
publish = false

readme = "../README.md"
[dependencies]
criterion = "0.5"
divan = "0.1"
bcinr-core = { path = "../bcinr-core", version = "26.7.25" }
bcinr-logic = { path = "../crates/bcinr-logic", version = "26.7.28", features = ["bench", "alloc"] }
bcinr-pddl = { path = "../crates/bcinr-pddl" }
bcinr-mcp = { path = "../crates/bcinr-mcp" }
bcinr-mfw-ir = { path = "../crates/bcinr-mfw-ir" }
bcinr-powl = { path = "../crates/bcinr-powl" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prettytable-rs = "0.10.0"

[features]
alloc = ["bcinr-logic/alloc"]
bench = ["bcinr-logic/bench"]

[[bench]]
name = "bcinr_bench"
harness = false

[[bench]]
name = "all_300_bench"
harness = false

[[bench]]
name = "algorithms_1_100"
harness = false

[[bench]]
name = "algorithms_101_200"
harness = false

[[bench]]
name = "algorithms_201_300"
harness = false

[[bench]]
name = "algorithms_301_307"
harness = false

[[bench]]
name = "missing_bench"
harness = false

[[bench]]
name = "patterns_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false

[[bench]]
name = "fix_bench"
harness = false

[[bench]]
name = "pddl_quick_bench"
harness = false

[[bench]]
name = "logic_dfa_swar_bench"
harness = false

[[bench]]
name = "dfcm_crown_bench"
harness = false

[[bench]]
name = "mcp_cache_bench"
harness = false

[[bench]]
name = "mfw_hotpath_bench"
harness = false

[[example]]
name = "timing"
