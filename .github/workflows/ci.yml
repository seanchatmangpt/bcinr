name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Temporary, branch-bounded actuation rail. It becomes a no-op after the
  # semantic migration commits and is removed before merge.
  repair_lsp:
    name: Repair LSP semantic boundary
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/finish-bcinr-lsp'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-bcinr-lsp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Replace stub ANDON dependency
        run: python3 .github/scripts/repair_lsp.py
      - name: Format and resolve workspace
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit semantic repair
        run: |
          if git diff --quiet -- Cargo.lock crates/bcinr-pddl-lsp; then
            echo "LSP semantic boundary is already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/bcinr-pddl-lsp
          git commit -m "fix(lsp): route ANDON through local admitted engine"
          git push origin HEAD:agent/finish-bcinr-lsp

  # 1. Lint & Format
  style:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 2. Security Audit
  security:
    name: Security & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit & cargo-deny
        run: cargo install cargo-audit cargo-deny --locked || true
      - name: Security audit
        run: cargo audit
      - name: License & Dependency Check
        run: cargo deny check

  # 3. Test Matrix
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.rust }})
    needs: [style]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-make
        run: cargo install cargo-make || true
      - name: Run CI Task
        run: cargo make ci
        shell: bash

  # 4. Documentation
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
