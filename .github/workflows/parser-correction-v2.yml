name: Apply Parser Correction

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: parser-correction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply and verify parser correction
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply correction
        run: python scripts/patch-parse-temporal.py
      - name: Format
        run: rustfmt +nightly crates/bcinr-pddl/src/parse.rs
      - name: Verify parser
        run: cargo test -p bcinr-pddl --all-features --lib parse
      - name: Verify canonical IPC
        run: cargo test -p bcinr-pddl --all-features --test canonical_ipc
      - name: Commit correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/bcinr-pddl/src/parse.rs
          git commit -m "fix: disambiguate at predicates from temporal wrappers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
