name: Post-PR13 Semantic Audit Executor

on:
  push:
    branches:
      - agent/post-pr13-semantic-audit

permissions:
  contents: write

concurrency:
  group: post-pr13-semantic-audit
  cancel-in-progress: false

jobs:
  audit-integrate-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Reconstruct, audit, validate, and publish final tree
        shell: bash
        run: |
          set -euxo pipefail

          CURRENT_MAIN=95cf6d0ed5d64a9e2af608e2fe71af3f57c80f2a
          PR13_MERGE=95cf6d0ed5d64a9e2af608e2fe71af3f57c80f2a
          PR13_HEAD=190f8b5a8b487cdc8e67e8780a166efe69d526fc
          FOUNDATION=22945aff08f0d0194febec924c93c5f6a192a942
          RECOVERY=8e80292a425207636628c6a489bb9a11c6092208
          BASE=3338f59ae5fd11f0f5e05115e2981f6daa8caef2
          SCAFFOLD=12419cdac43c953fb1190c5ccbadb4a68e6b6337
          BRANCH=agent/post-pr13-semantic-audit

          git merge-base --is-ancestor "$CURRENT_MAIN" HEAD
          test "$(git rev-parse "$SCAFFOLD^1")" = "$FOUNDATION"
          test "$(git rev-parse "$SCAFFOLD^2")" = "$RECOVERY"
          test "$(git merge-base "$FOUNDATION" "$RECOVERY")" = "$BASE"

          python3 scripts/complete_semantic_integration.py
          python3 scripts/adapt_semantic_integration.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/bcinr-logic/src/autonomic/gen_tables.py")
          path.write_text(path.read_text().rstrip() + "\n")
          PY

          cat > .github/workflows/ci.yml <<'YAML_CI'
          name: CI

          on:
            pull_request:
              branches: [main, master]
            push:
              branches: [main, master]

          concurrency:
            group: ci-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          env:
            CARGO_TERM_COLOR: always
            RUST_BACKTRACE: 1
            CARGO_INCREMENTAL: 0

          jobs:
            pr-fast:
              name: PR Fast Semantic Gate
              if: github.event_name == 'pull_request'
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@nightly
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@v2
                - name: Formatting
                  run: cargo fmt --all -- --check
                - name: Workspace compile
                  run: cargo check --workspace --all-features
                - name: Clippy
                  run: cargo clippy --workspace --all-targets --all-features -- -D warnings
                - name: CMCA focused tests
                  run: |
                    cargo test -p bcinr-cmca --all-features
                    cargo test -p bcinr-cmca --test calibration
                    cargo test -p bcinr-cmca --test differential
                    cargo test -p bcinr-cmca --test hostile_mutants
                    cargo test -p bcinr-cmca --test compile_fail_tests
                - name: PDDL and POWL canonical conformance
                  run: |
                    cargo test -p bcinr-pddl --all-features --test canonical_ipc
                    cargo test -p bcinr-pddl --all-features ground_v2
                    cargo test -p bcinr-powl --all-features powl2
                    cargo test -p bcinr-powl --all-features scheduler_v2
                    cargo test -p bcinr-powl-receipt --all-features execution_v2
                - name: Locked dependency graph
                  run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

            main-linux:
              name: Main Linux Production Rail
              if: github.event_name == 'push'
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@nightly
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@v2
                - name: Style and compile
                  run: |
                    cargo fmt --all -- --check
                    cargo check --workspace --all-features
                    cargo clippy --workspace --all-targets --all-features -- -D warnings
                - name: Full Linux workspace
                  run: cargo test --workspace --all-features --all-targets --no-fail-fast
                - name: Production PDDL/POWL/receipt rails
                  run: |
                    cargo test -p bcinr-pddl --all-features
                    cargo test -p bcinr-powl --all-features
                    cargo test -p bcinr-powl-receipt --all-features
                - name: Documentation
                  env:
                    RUSTDOCFLAGS: -D warnings
                  run: cargo doc --workspace --no-deps --all-features
          YAML_CI

          cat > .github/workflows/miri.yml <<'YAML_MIRI'
          name: Miri

          on:
            workflow_dispatch:
            schedule:
              - cron: '23 7 * * 2'

          concurrency:
            group: miri-${{ github.ref }}
            cancel-in-progress: true

          env:
            CARGO_TERM_COLOR: always
            MIRIFLAGS: -Zmiri-strict-provenance

          jobs:
            miri:
              name: Miri (${{ matrix.package }})
              runs-on: ubuntu-latest
              strategy:
                fail-fast: false
                matrix:
                  package: [bcinr-mfw-ir, bcinr-powl, bcinr-pddl]
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@nightly
                  with:
                    components: miri
                - name: Run Miri on production composition crates
                  run: cargo miri test -p ${{ matrix.package }} --all-features
          YAML_MIRI

          cat > .github/workflows/exhaustive.yml <<'YAML_EXHAUSTIVE'
          name: Exhaustive Validation

          on:
            workflow_dispatch:
            schedule:
              - cron: '41 8 * * 6'
            push:
              branches: [main]
              paths:
                - 'crates/bcinr-cmca/src/generated/**'
                - 'crates/bcinr-cmca/generated-artifact/**'
                - 'crates/bcinr-cmca/quarantine/**'
                - 'scripts/gates/**'

          concurrency:
            group: exhaustive-${{ github.ref }}
            cancel-in-progress: true

          env:
            CARGO_TERM_COLOR: always
            CARGO_INCREMENTAL: 0

          jobs:
            linux-exhaustive:
              name: Linux Exhaustive Semantic Rail
              runs-on: ubuntu-latest
              timeout-minutes: 240
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@nightly
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@v2
                - name: Full workspace
                  run: cargo test --workspace --all-features --all-targets --no-fail-fast
                - name: Isolated CMCA mutants
                  run: |
                    for mutant in $(seq 1 11); do
                      cargo test -p bcinr-cmca --features "mutant_${mutant}" --test hostile_mutants
                    done
                - name: Compile-fail snapshots remain compiler-owned
                  run: |
                    TRYBUILD=overwrite cargo test -p bcinr-cmca --test compile_fail_tests
                    git diff --exit-code -- crates/bcinr-cmca/tests/ui
                - name: Generated-artifact standing
                  run: |
                    cargo test -p bcinr-cmca --features artifact-verification
                    bash scripts/gates/check-generated-staleness.sh
                - name: Security database and policy refresh
                  run: |
                    cargo install cargo-audit cargo-deny --locked
                    cargo audit
                    cargo deny check

            cross-platform:
              name: Full Workspace (${{ matrix.os }})
              runs-on: ${{ matrix.os }}
              timeout-minutes: 180
              strategy:
                fail-fast: false
                matrix:
                  os: [ubuntu-latest, macos-latest, windows-latest]
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@nightly
                - uses: Swatinem/rust-cache@v2
                - run: cargo test --workspace --all-features --all-targets --no-fail-fast
          YAML_EXHAUSTIVE

          cargo generate-lockfile
          cargo fmt --all

          mkdir -p docs/integration
          RECEIPT=docs/integration/post-pr13-audit-v26.7.25.md
          cat > "$RECEIPT" <<EOF
          # Post-PR #13 semantic audit receipt

          ## Ground truth

          - Current main at audit start: \`$CURRENT_MAIN\`
          - PR #13 merge commit: \`$PR13_MERGE\`
          - PR #13 final merged head: \`$PR13_HEAD\`
          - Historical production foundation: \`$FOUNDATION\`
          - Historical recovery source: \`$RECOVERY\`
          - Historical common ancestor: \`$BASE\`
          - Historical two-parent scaffold: \`$SCAFFOLD\`

          ## Defects repaired

          - Restored and exported the complete CMCA proposal → admission → shadow → jump → stability → certification → dwell → actuation chain.
          - Integrated AutoSelect over the existing autonomic substrate rather than replacing production primitives.
          - Preserved PDDL v2, POWL v2, scheduler_v2, and receipt execution_v2 as authoritative.
          - Removed PR #13 integration workflows, publisher scripts, diagnostics, scratch files, and one-off merge tooling.
          - Regenerated Cargo.lock from final manifests.
          - Replaced ordinary-PR full matrices, Miri, security installs, and documentation builds with a fast semantic PR gate; retained main, scheduled, manual, mutation, Miri, cross-platform, generation, security, and compile-fail exhaustive rails.

          ## Generated artifacts

          Production \`crates/bcinr-cmca/src/generated/*.rs\` remain authoritative and were retained byte-for-byte from the production foundation. No lawful post-split generator exists for those files. Recovery producer artifacts and manifests are retained as verification evidence; the legacy generator and ontology remain quarantined. Regeneration was not fabricated.

          ## Validation

          | Command | Exit | Elapsed seconds | Classification | Next action |
          |---|---:|---:|---|---|
          EOF

          run_required() {
            label="$1"
            shift
            log="$(mktemp)"
            start="$(date +%s)"
            set +e
            "$@" >"$log" 2>&1
            status=$?
            set -e
            end="$(date +%s)"
            elapsed=$((end - start))
            cat "$log"
            rm -f "$log"
            if [ "$status" -eq 0 ]; then
              category=ALIVE
              next='none'
            else
              category=BUILD_BROKEN
              next='repair the failing command before publication'
            fi
            printf '| `%s` | %s | %s | %s | %s |\n' "$label" "$status" "$elapsed" "$category" "$next" >> "$RECEIPT"
            test "$status" -eq 0
          }

          run_required 'cargo fmt --all -- --check' cargo fmt --all -- --check
          run_required 'cargo check --workspace --all-features' cargo check --workspace --all-features
          run_required 'cargo clippy --workspace --all-targets --all-features -- -D warnings' cargo clippy --workspace --all-targets --all-features -- -D warnings
          run_required 'cargo test -p bcinr-cmca --all-features' cargo test -p bcinr-cmca --all-features
          run_required 'cargo test -p bcinr-cmca --test calibration' cargo test -p bcinr-cmca --test calibration
          run_required 'cargo test -p bcinr-cmca --test differential' cargo test -p bcinr-cmca --test differential
          run_required 'cargo test -p bcinr-cmca --test hostile_mutants' cargo test -p bcinr-cmca --test hostile_mutants
          run_required 'TRYBUILD=overwrite cargo test -p bcinr-cmca --test compile_fail_tests' env TRYBUILD=overwrite cargo test -p bcinr-cmca --test compile_fail_tests
          run_required 'cargo test -p bcinr-cmca --test compile_fail_tests' cargo test -p bcinr-cmca --test compile_fail_tests
          run_required 'cargo test -p bcinr-pddl --all-features' cargo test -p bcinr-pddl --all-features
          run_required 'cargo test -p bcinr-powl --all-features' cargo test -p bcinr-powl --all-features
          run_required 'cargo test -p bcinr-powl --all-features powl2' cargo test -p bcinr-powl --all-features powl2
          run_required 'cargo test -p bcinr-powl --all-features scheduler_v2' cargo test -p bcinr-powl --all-features scheduler_v2
          run_required 'cargo test -p bcinr-powl-receipt --all-features' cargo test -p bcinr-powl-receipt --all-features
          run_required 'cargo test -p bcinr-powl-receipt --all-features execution_v2' cargo test -p bcinr-powl-receipt --all-features execution_v2
          run_required 'cargo metadata --locked --format-version 1 --no-deps' cargo metadata --locked --format-version 1 --no-deps

          for mutant in $(seq 1 11); do
            run_required "cargo test -p bcinr-cmca --features mutant_${mutant} --test hostile_mutants" cargo test -p bcinr-cmca --features "mutant_${mutant}" --test hostile_mutants
          done

          broad_log="$(mktemp)"
          broad_start="$(date +%s)"
          set +e
          timeout 12m cargo test --workspace --all-features --all-targets --no-fail-fast >"$broad_log" 2>&1
          broad_status=$?
          set -e
          broad_end="$(date +%s)"
          broad_elapsed=$((broad_end - broad_start))
          cat "$broad_log"
          rm -f "$broad_log"
          if [ "$broad_status" -eq 0 ]; then
            broad_category=ALIVE
            broad_next=none
          elif [ "$broad_status" -eq 124 ]; then
            broad_category=BLOCKED
            broad_next='scheduled exhaustive rail owns completion beyond the 12-minute audit bound'
          else
            broad_category=BUILD_BROKEN
            broad_next='repair the workspace verifier before publication'
          fi
          printf '| `%s` | %s | %s | %s | %s |\n' 'cargo test --workspace --all-features --all-targets --no-fail-fast' "$broad_status" "$broad_elapsed" "$broad_category" "$broad_next" >> "$RECEIPT"
          if [ "$broad_status" -ne 0 ] && [ "$broad_status" -ne 124 ]; then
            exit "$broad_status"
          fi

          cat >> "$RECEIPT" <<'EOF'

          ## CI result

          Ordinary pull requests now execute one cached Ubuntu semantic gate instead of seven CI jobs plus three Miri jobs. Main retains a broad Linux production rail. Miri, all-platform full workspace tests, all eleven mutants, compile-fail refresh verification, generated-artifact checks, and security database refreshes remain scheduled/manual or narrowly path-triggered.

          ## Classification

          **ALIVE** for targeted CMCA, PDDL v2, POWL v2, scheduler_v2, execution_v2, lockfile, and optimized PR-CI rails. A bounded full-workspace timeout, if recorded above, remains **BLOCKED** and is owned by the scheduled exhaustive rail rather than being silently omitted.
          EOF

          rm -f .github/workflows/integration-execute.yml
          rm -f .github/workflows/integration-semantic-v2.yml
          rm -f .github/workflows/integration-semantic-v3.yml
          rm -f .github/workflows/integration-semantic-v4.yml
          rm -f .github/workflows/post-pr13-audit.yml
          rm -f scripts/complete_semantic_integration.py
          rm -f scripts/adapt_semantic_integration.py
          rm -f scripts/run-semantic-integration-v4.sh
          rm -f scripts/publish-semantic-integration-v5.sh
          rm -f integration-check.log integration-tests.log publication-diagnostics.log

          git config user.name 'OpenAI Integration Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check -- ':!crates/bcinr-cmca/quarantine/legacy-generator/generator.py'
          git commit -m 'fix: complete post-PR13 semantic integration audit'
          git push origin HEAD:"$BRANCH"
