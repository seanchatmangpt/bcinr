[package]
name = "bcinr-process-intelligence"
version = "0.1.0"
description = "A branchless, zero-allocation, #![no_std] process intelligence library suite containing petri net replay, YAWL routing, POWL compilation, and WASM bindings."
authors = ["Antigravity <noreply@google.com>"]
license = "MIT"
repository = "https://github.com/seanchatmangpt/bcinr"
keywords = ["bcinr", "process-intelligence", "petri-net", "yawl", "powl", "wasm", "branchless"]

[dependencies]
bcinr = { path = "../bcinr" }
bcinr-logic = { path = "../crates/bcinr-logic" }

[templates]
"src/petri.rs" = { description = "Branchless Petri Net engine" }
"src/yawl.rs" = { description = "Branchless YAWL routing engine" }
"src/powl.rs" = { description = "Branchless POWL compiler/executor" }
"src/wasm.rs" = { description = "#![no_std] WebAssembly API boundary" }
"src/lib.rs" = { description = "Library entrypoint exporting the modules" }

[scripts]
test = "cargo test"
build = "cargo build --release"
clippy = "cargo clippy -- -D warnings"

[validation]
required_files = ["src/petri.rs", "src/yawl.rs", "src/powl.rs", "src/wasm.rs", "src/lib.rs"]
min_ggen_version = "1.0.0"

[features]
rust = true
no_std = true
petri = true
yawl = true
powl = true
wasm = true

[tags]
stable = true
production-ready = true
rust = true
process-intelligence = true
branchless = true
