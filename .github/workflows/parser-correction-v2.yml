name: Parser Correction Proof V2

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: parser-correction-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Validate corrected parser blob
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply structural correction
        run: python scripts/patch-parse-temporal.py
      - name: Format corrected parser
        run: rustfmt +nightly crates/bcinr-pddl/src/parse.rs
      - name: Parser unit proof
        run: cargo test -p bcinr-pddl --all-features --lib parse
      - name: Canonical IPC proof
        run: cargo test -p bcinr-pddl --all-features --test canonical_ipc
      - name: Create unreferenced corrected blob
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          content = Path("crates/bcinr-pddl/src/parse.rs").read_bytes()
          Path("parse-blob-request.json").write_text(json.dumps({
              "content": base64.b64encode(content).decode(),
              "encoding": "base64",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @parse-blob-request.json \
            "https://api.github.com/repos/${GH_REPOSITORY}/git/blobs" \
            > parse-corrected-blob.json
          cat parse-corrected-blob.json
      - name: Upload corrected blob identity
        uses: actions/upload-artifact@v4
        with:
          name: parse-corrected-blob-proof-v2
          path: parse-corrected-blob.json
          if-no-files-found: error
