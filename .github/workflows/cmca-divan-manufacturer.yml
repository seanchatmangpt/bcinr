name: CMCA Divan Isolated Verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install benchmark toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo state
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cmca-divan-isolated-stable

      - name: Isolate benchmark in CMCA package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/bcinr-cmca/benches
          cp bcinr-bench/benches/cmca_execution_bench.rs \
            crates/bcinr-cmca/benches/cmca_execution_bench.rs
          python - <<'PY'
          from pathlib import Path

          cmca = Path('crates/bcinr-cmca/Cargo.toml')
          text = cmca.read_text()
          if 'divan = "0.1"' not in text:
              text = text.replace('proptest = "1.2.0"\n', 'proptest = "1.2.0"\ndivan = "0.1"\n')
          if 'name = "cmca_execution_bench"' not in text:
              text = text.rstrip() + '\n\n[[bench]]\nname = "cmca_execution_bench"\nharness = false\n'
          cmca.write_text(text)
          PY
          cargo fmt --all

      - name: Compile isolated CMCA Divan target
        run: cargo +stable check -p bcinr-cmca --bench cmca_execution_bench

      - name: Lint isolated CMCA Divan target
        run: cargo +stable clippy -p bcinr-cmca --bench cmca_execution_bench -- -D warnings

      - name: Execute isolated CMCA Divan baseline
        id: bench
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +stable bench -p bcinr-cmca --bench cmca_execution_bench 2>&1 | tee cmca-divan-isolated-output.txt

      - name: Upload complete Divan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmca-divan-isolated-${{ github.run_id }}
          path: cmca-divan-isolated-output.txt
          if-no-files-found: error

      - name: Enforce benchmark result
        if: steps.bench.outcome == 'failure'
        run: exit 1
