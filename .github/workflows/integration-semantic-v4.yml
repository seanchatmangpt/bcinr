name: Complete Semantic Integration V4

on:
  push:
    branches:
      - agent/semantic-three-way-integration-v26.7.24
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: complete-semantic-integration-v4
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-three-way-integration-v26.7.24
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Execute semantic merge, validation, and publication
        run: bash scripts/publish-semantic-integration-v5.sh
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-integration-v4-diagnostics
          path: |
            integration-check.log
            integration-tests.log
            publication-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
