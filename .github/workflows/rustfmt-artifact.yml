name: Rustfmt Artifact

on:
  push:
    branches:
      - agent/v26.7.24-production-pddl-powl-v2

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Manufacture rustfmt patch
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
          test -s rustfmt.patch || printf 'NO_CHANGES\n' > rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
