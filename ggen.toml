[project]
# `name` and `version` are both required: the manifest loader uses the presence
# of `version` to disambiguate the declarative-rules schema (this one) from the
# frontmatter schema. `description` is not a field of either.
name = "bcinr"
version = "26.7.28"

[ontology]
# The admitted graph is a union of committed sources. `imports` is a first-class
# field of the manifest schema, so there is no derived concatenation to keep in
# sync -- and nothing here can point at a path that is not in the repository.
source = "ontology/bcinr.ttl"
imports = [
    "ontology/taxonomies.ttl",
    "ontology/profile.ttl",
]

# --- Fail-closed admission gates ----------------------------------------------
#
# Each gate is a SELECT evaluated against the post-materialization graph -- the
# union of `source` and `imports` above -- in listed order. Any returned row is a
# violation and refuses the sync before a single file is written.
#
# `[validation].gates`, not `[law].gates`: this manifest carries `version`, so it
# is read by ggen's declarative-rules path, which takes gates from
# `manifest.validation.gates` (`ggen-engine/src/generation_rules.rs:320`). The
# frontmatter path's `[law].gates` (`sync.rs:520`) deserializes here without
# error and never executes -- a gate that silently does nothing is worse than no
# gate, so the distinction is load-bearing rather than stylistic.
#
# Each gate file joins the receipt's input closure, so removing one is recorded
# rather than silent.
#
# These are the checks SHACL structurally cannot make: `ontology/shapes.ttl` is
# applied per-file, so no shape can reach a referent declared in a sibling file.
[validation]
gates = [
    "queries/gate-referent-exists.rq",
    "queries/gate-case-uniqueness.rq",
]

[generation]
output_dir = "."

# --- POWL 2.0 model taxonomy -------------------------------------------------
#
# The 6 Powl2Model variants are matched exhaustively in 13 files across 3
# crates. This is the first projection: the variant set, its paper-core /
# execution-superset tier, arity bounds, normalization targets and paper
# citations, plus a `classify` tripwire whose match has no `_` arm.

[[generation.rules]]
name = "powl2_case"
query = { file = "queries/powl2-cases.rq" }
template = { file = "templates/powl2_case.rs.tera" }
output_file = "crates/bcinr-guarded/src/powl2_case.rs"
mode = "Overwrite"

# --- Def 3.7 arity side conditions -------------------------------------------

[[generation.rules]]
name = "powl2_arity"
query = { file = "queries/powl2-arity.rq" }
template = { file = "templates/powl2_arity.rs.tera" }
output_file = "crates/bcinr-powl/src/generated_arity.rs"
mode = "Overwrite"

# --- Every closed taxonomy in the system, from one generic template ---------

[[generation.rules]]
name = "taxonomies"
query = { file = "queries/taxonomy-cases.rq" }
template = { file = "templates/taxonomy.rs.tera" }
output_file = "crates/bcinr-guarded/src/taxonomy.rs"
mode = "Overwrite"

[[generation.rules]]
name = "profile"
query = { file = "queries/profile-constants.rq" }
template = { file = "templates/profile.rs.tera" }
output_file = "crates/bcinr-cmca/src/generated_profile.rs"
mode = "Overwrite"

[[generation.rules]]
name = "runtime_bindings"
query = { file = "queries/runtime-bindings.rq" }
template = { file = "templates/runtime_binding.rs.tera" }
output_file = "crates/bcinr-guarded/src/runtime_binding.rs"
mode = "Overwrite"

# --- Executable falsifiers ---------------------------------------------------
#
# The only rule here whose output moves a claim across the decidability gap:
# every other projection guarantees the graph and the code agree, which is
# syntactic. This one turns "this refusal is reachable" from a comment into a
# computation that runs.

[[generation.rules]]
name = "refusal_falsifiers"
query = { file = "queries/refusal-falsifiers.rq" }
template = { file = "templates/refusal_falsifier.rs.tera" }
output_file = "crates/bcinr-guarded/tests/generated_falsifiers.rs"
mode = "Overwrite"

[[generation.rules]]
name = "refusal_ledger"
query = { file = "queries/refusal-ledger.rq" }
template = { file = "templates/refusal_ledger.md.tera" }
output_file = "docs/contracts/REFUSAL_LEDGER.md"
mode = "Overwrite"

[[generation.rules]]
name = "fetch_oracles"
query = { file = "queries/reference-implementations.rq" }
template = { file = "templates/fetch_oracles.sh.tera" }
output_file = "oracles/fetch.sh"
mode = "Overwrite"
