[package]
name = "powl-oracle-runner"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately OUTSIDE the bcinr workspace: serde_json is needed only to read the
# shared corpus, and an oracle harness must not add a dependency to the crate it
# is meant to independently check.
[workspace]

[dependencies]
bcinr-powl = { path = "../../../crates/bcinr-powl" }
serde_json = "1"
