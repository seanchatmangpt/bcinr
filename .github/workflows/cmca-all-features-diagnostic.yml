name: CMCA All-Features Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: cmca-all-features-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/repair-post-integration-verification-ci' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-post-integration-verification-ci
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/repair_post_integration_verification.py
      - run: python3 scripts/repair_cmca_all_features_composition.py
      - run: cargo fmt --all
      - name: Execute and capture CMCA all-features
        shell: bash
        run: |
          set -o pipefail
          cargo test -p bcinr-cmca --all-features 2>&1 | tee cmca-all-features.log
      - name: Upload CMCA transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmca-all-features-${{ github.run_id }}
          path: cmca-all-features.log
          if-no-files-found: error
          retention-days: 7
