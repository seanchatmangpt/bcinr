              fn preserves_boolean_quantified_and_conditional_trees() {'''))

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one parser replacement, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          Path("parse-corrected.rs").write_text(source)
          request = {
              "content": base64.b64encode(source.encode()).decode(),
              "encoding": "base64",
          }
          Path("parse-blob-request.json").write_text(json.dumps(request))
          PY
          rustfmt +nightly parse-corrected.rs
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          source = Path("parse-corrected.rs").read_bytes()
          Path("parse-blob-request.json").write_text(json.dumps({
              "content": base64.b64encode(source).decode(),
              "encoding": "base64",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @parse-blob-request.json \
            "https://api.github.com/repos/${GH_REPOSITORY}/git/blobs" \
