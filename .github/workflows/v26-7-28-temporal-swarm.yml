name: v26.7.28 Temporal Swarm Manufacturer

on:
  push:
    branches:
      - agent/v26.7.28-temporal-swarm
  pull_request:
    branches:
      - main
    paths:
      - crates/bcinr-pddl/**
      - contracts/v26.7.28/**
      - docs/releases/v26.7.28-temporal-runtime.md
      - .github/workflows/v26-7-28-temporal-swarm.yml
  workflow_dispatch:

env:
  GGEN_RUNTIME_COMMIT: 50164750c70b8808a71706702aee68b2f3a77875

permissions:
  contents: write

concurrency:
  group: v26-7-28-temporal-swarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manufacture-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout BCINR
        uses: actions/checkout@v4
        with:
          path: bcinr
          fetch-depth: 0

      - name: Checkout exact ggen manufactured commit
        uses: actions/checkout@v4
        with:
          repository: seanchatmangpt/ggen
          ref: ${{ env.GGEN_RUNTIME_COMMIT }}
          path: ggen
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Admit manufactured contract family
        run: |
          set -eu
          generated=ggen/examples/bcinr-v26-7-28/generated
          test -f "$generated/temporal_contract.rs"
          test -f "$generated/swarm_scenarios.rs"
          test -f "$generated/bcinr_temporal.h"
          test -f "$generated/bcinr-temporal.wit"
          test -f "$generated/conformance_vectors.json"
          mkdir -p bcinr/crates/bcinr-pddl/src/generated
          mkdir -p bcinr/contracts/v26.7.28
          cp "$generated/temporal_contract.rs" \
             bcinr/crates/bcinr-pddl/src/generated/temporal_contract.rs
          cp "$generated/swarm_scenarios.rs" \
             bcinr/crates/bcinr-pddl/src/generated/swarm_scenarios.rs
          cp "$generated/bcinr_temporal.h" \
             bcinr/contracts/v26.7.28/bcinr_temporal.h
          cp "$generated/bcinr-temporal.wit" \
             bcinr/contracts/v26.7.28/bcinr-temporal.wit
          cp "$generated/conformance_vectors.json" \
             bcinr/contracts/v26.7.28/conformance_vectors.json

      - name: Format source without rewriting generated projections
        working-directory: bcinr
        run: |
          cargo fmt --all
          if ! git diff --quiet -- crates/bcinr-pddl/src/generated; then
            echo "ggen Rust projections are not rustfmt-stable" >&2
            git diff -- crates/bcinr-pddl/src/generated
            exit 1
          fi

      - name: Publish manufactured and formatted bytes to the BCINR branch
        if: github.event_name == 'push'
        working-directory: bcinr
        run: |
          git diff --check
          git add crates/bcinr-pddl contracts/v26.7.28
          if git diff --cached --quiet; then
            echo "manufactured projections and source already match"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore(v26.7.28): materialize and format temporal runtime"
            git push
          fi

      - name: Prove exact ggen byte identity
        run: |
          cmp ggen/examples/bcinr-v26-7-28/generated/temporal_contract.rs \
              bcinr/crates/bcinr-pddl/src/generated/temporal_contract.rs
          cmp ggen/examples/bcinr-v26-7-28/generated/swarm_scenarios.rs \
              bcinr/crates/bcinr-pddl/src/generated/swarm_scenarios.rs
          cmp ggen/examples/bcinr-v26-7-28/generated/bcinr_temporal.h \
              bcinr/contracts/v26.7.28/bcinr_temporal.h
          cmp ggen/examples/bcinr-v26-7-28/generated/bcinr-temporal.wit \
              bcinr/contracts/v26.7.28/bcinr-temporal.wit
          cmp ggen/examples/bcinr-v26-7-28/generated/conformance_vectors.json \
              bcinr/contracts/v26.7.28/conformance_vectors.json

      - name: Refuse LLM providers and prove zero-call vectors
        working-directory: bcinr
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          vectors = json.loads(Path("contracts/v26.7.28/conformance_vectors.json").read_text())
          assert vectors["llm_calls"] == 0
          assert len(vectors["scenarios"]) == 10
          PY
          if grep -RniE 'api\.openai\.com|api\.anthropic\.com|openai[[:space:]_-]*client|anthropic[[:space:]_-]*client|ollama[[:space:]_-]*(client|endpoint)' \
            crates/bcinr-pddl/src/temporal_production.rs \
            crates/bcinr-pddl/src/swarm_validation.rs \
            crates/bcinr-pddl/tests/temporal_swarm_v26_7_28.rs \
            crates/bcinr-pddl/tests/manufactured_swarm_scenarios_v26_7_28.rs \
            crates/bcinr-pddl/benches/temporal_swarm_v26_7_28.rs \
            contracts/v26.7.28; then
            echo "LLM provider or endpoint dependency detected in deterministic temporal rail" >&2
            exit 1
          fi

      - name: Format
        working-directory: bcinr
        run: cargo fmt --all -- --check

      - name: Compile temporal production rail
        working-directory: bcinr
        run: cargo check -p bcinr-pddl --all-features

      - name: Clippy changed temporal rail
        working-directory: bcinr
        shell: bash
        run: |
          set +e
          cargo clippy -p bcinr-pddl \
            --lib \
            --test temporal_swarm_v26_7_28 \
            --test manufactured_swarm_scenarios_v26_7_28 \
            --bench temporal_swarm_v26_7_28 \
            --all-features \
            -- -D warnings > /tmp/v26-7-28-clippy.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 160 /tmp/v26-7-28-clippy.log
            exit "$status"
          fi
          tail -n 30 /tmp/v26-7-28-clippy.log

      - name: Retain Clippy diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-28-clippy-diagnostic
          path: /tmp/v26-7-28-clippy.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Execute temporal PDDL swarm scenarios
        working-directory: bcinr
        run: cargo test -p bcinr-pddl --test temporal_swarm_v26_7_28 -- --nocapture

      - name: Execute all ggen-manufactured swarm scenarios
        working-directory: bcinr
        run: cargo test -p bcinr-pddl --test manufactured_swarm_scenarios_v26_7_28 -- --nocapture

      - name: Compile Divan temporal benchmarks
        working-directory: bcinr
        shell: bash
        run: |
          set +e
          cargo bench -p bcinr-pddl --bench temporal_swarm_v26_7_28 --no-run \
            > /tmp/v26-7-28-bench.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 160 /tmp/v26-7-28-bench.log
            exit "$status"
          fi
          tail -n 30 /tmp/v26-7-28-bench.log

      - name: Retain benchmark diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v26-7-28-benchmark-diagnostic
          path: /tmp/v26-7-28-bench.log
          if-no-files-found: ignore
          retention-days: 7
