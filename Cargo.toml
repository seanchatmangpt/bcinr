[workspace]
members = ["bcinr", "bcinr-core", "bcinr-bench", "crates/bcinr-api", "crates/bcinr-logic", "tools/bcinr-reporter", "tools/bcinr-contract-gate", "tools/bcinr-bench-auditor", "tools/rust_audit", "crates/encode_unicode_patch"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[patch.crates-io]
encode_unicode = { path = "crates/encode_unicode_patch" }
