[package]
name = "bcinr-powl"
version = "26.7.25"
edition = "2021"
description = "POWL 2.0 model, compiler, concurrency guards, executable scheduler, and cryptographic execution evidence"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/bcinr"
readme = "../../README.md"
keywords = ["workflow", "branchless", "petri", "conformance", "blake3"]
categories = ["algorithms", "data-structures"]

[dependencies]
bcinr-logic = { version = "26.7.25", path = "../bcinr-logic" }
# Shared IR types/trait contracts for multifractal planning. This edge is one-way.
bcinr-mfw-ir = { version = "26.7.25", path = "../bcinr-mfw-ir" }
# Multifractal consequence allocation over the POWL process hierarchy
# (`crate::multifractal`). One-way: bcinr-cmca is `no_std` and knows nothing
# about POWL, so the join lives here, on the side that already has the tree.
bcinr-cmca = { version = "26.7.25", path = "../bcinr-cmca", features = ["alloc"] }
blake3 = "1"
wasm4pm-compat = "26.6.29"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
divan = "0.1"
trybuild = "1"
proptest = "1"
chicago-tdd-tools = { version = "26.7.1", features = ["ocel-generation"] }
ocel = "0.1.5"
serde_json = "1"

[features]
default = []
std = ["serde", "dep:serde_json"]
nightly = []
testing = []

# Declared with `required-features` rather than an inner `#![cfg(feature =
# "std")]`: with the attribute, a default `cargo test` compiles the file to an
# empty binary and reports "ok. 0 passed", which is indistinguishable from the
# suite passing. With `required-features`, cargo skips the target and says so.
[[test]]
name = "chicago_tdd_integration"
required-features = ["std"]

[[bench]]
name = "powl_quick_bench"
harness = false

[[bench]]
name = "powl_pipeline_bench"
harness = false

[[bench]]
name = "phase3_scheduler"
harness = false
