name: v26.7.28 format
on:
  pull_request:
    branches: [feat/v26.7.28-powl2-multifractal]
permissions:
  contents: write
concurrency:
  group: v26-7-28-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Consume final log2 normalization state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/bcinr-cmca/src/fixed.rs")
          text = path.read_text()
          old = "        bit!(0);\n\n        let computed ="
          new = "        bit!(0);\n        let _ = normalized;\n\n        let computed ="
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: close warning and apply rustfmt"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
