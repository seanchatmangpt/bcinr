name: PR11 ggen Sync

on:
  push:
    branches:
      - recovery/cmca-v26.7.17-c2

permissions:
  contents: write

jobs:
  ggen-sync:
    if: startsWith(github.event.head_commit.message, 'chore(pr11): run ggen sync')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: recovery/cmca-v26.7.17-c2
          fetch-depth: 0
          persist-credentials: true

      - name: Download ggen v26.15.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/seanchatmangpt/ggen/releases/download/v26.15.2/ggen-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x ./ggen
          ./ggen --version || true

      - name: Run ggen sync
        shell: bash
        run: |
          set -o pipefail
          mkdir -p docs/recovery
          {
            echo '# PR #11 ggen sync evidence'
            echo
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo "- input commit: \`${GITHUB_SHA}\`"
            echo "- ggen release: \`v26.15.2\`"
            echo
            echo '## Command'
            echo
            echo '```text'
            echo './ggen sync run'
            echo '```'
            echo
            echo '## Output'
            echo
            echo '```text'
          } > docs/recovery/PR11_GGEN_SYNC.md

          set +e
          ./ggen sync run 2>&1 | tee /tmp/ggen-sync.log
          status=${PIPESTATUS[0]}
          set -e

          cat /tmp/ggen-sync.log >> docs/recovery/PR11_GGEN_SYNC.md
          {
            echo '```'
            echo
            echo "- exit code: \`${status}\`"
            echo "- standing: \`REPORTED\`"
          } >> docs/recovery/PR11_GGEN_SYNC.md

          echo "GGEN_SYNC_EXIT_CODE=${status}" >> "$GITHUB_ENV"

      - name: Commit sync result and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ./ggen
          rm -f .github/workflows/pr11-merge-main.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No filesystem changes to commit.'
            exit 0
          fi
          git commit -m "chore(pr11): record ggen sync result (reported)"
          git push origin HEAD:recovery/cmca-v26.7.17-c2

      - name: Preserve ggen exit status
        shell: bash
        run: |
          test "${GGEN_SYNC_EXIT_CODE}" -eq 0
