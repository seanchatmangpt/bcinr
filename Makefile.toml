[config]
skip_core_tasks = false
default_to_workspace = true

[env]
CARGO_INCREMENTAL = "0"
RUSTFLAGS = "-D warnings"

[tasks.graph-validate]
workspace = false
command = "ggen"
args = ["graph", "validate", "--files", "ontology/bcinr.ttl", "--files", "ontology/taxonomies.ttl", "--files", "ontology/profile.ttl", "--shapes", "ontology/shapes.ttl"]

[tasks.ggen-sync]
workspace = false
dependencies = ["graph-validate"]
command = "ggen"
args = ["sync"]

[tasks.ggen-receipt-gate]
workspace = false
dependencies = ["ggen-sync"]
command = "python3"
args = ["scripts/verify_ggen_receipt.py", ".ggen-v2/receipt.json"]

[tasks.generated-clean]
workspace = false
dependencies = ["ggen-sync"]
command = "git"
args = ["diff", "--exit-code", "--", "crates/bcinr-cmca/src/generated_profile.rs", "crates/bcinr-guarded/src/powl2_case.rs", "crates/bcinr-guarded/src/runtime_binding.rs", "crates/bcinr-guarded/src/taxonomy.rs", "crates/bcinr-guarded/tests/generated_falsifiers.rs", "crates/bcinr-powl/src/generated_arity.rs", "docs/contracts/REFUSAL_LEDGER.md"]

[tasks.fmt]
workspace = false
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.check]
workspace = false
dependencies = ["graph-validate"]
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--all-features"]

[tasks.test]
workspace = false
command = "cargo"
args = ["test", "--workspace", "--all-features", "--all-targets", "--no-fail-fast"]

[tasks.clippy]
workspace = false
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.docs]
workspace = false
command = "cargo"
args = ["doc", "--workspace", "--all-features", "--no-deps", "--document-private-items"]

[tasks.contract-gate]
workspace = false
command = "cargo"
args = ["run", "--manifest-path", "tools/bcinr-contract-gate/Cargo.toml", "--release", "--quiet"]

[tasks.scan-cheats]
workspace = false
command = "cargo"
args = ["run", "--manifest-path", "tools/bcinr-cheat-scanner/Cargo.toml", "--release", "--quiet"]

[tasks.ggen-falsification]
workspace = false
command = "cargo"
args = ["run", "--manifest-path", "tools/ggen/Cargo.toml", "--release", "--quiet"]

[tasks.closure]
workspace = false
dependencies = ["ggen-receipt-gate", "generated-clean", "fmt", "check", "clippy", "test", "contract-gate", "scan-cheats", "ggen-falsification", "docs"]

[tasks.clean]
workspace = false
command = "cargo"
args = ["clean"]
