# ---------------------------------------------------------------------------
# Rule: proof_table_md  (STATIC -> receipt-cited Crown proof table, markdown)
#   queries/proof_table.rq -> templates/proof_table.md.tera
#   -> artifacts/proof_table.md
# Renders the opponent x budget Crown matrix from the imported results graph
# (artifacts/results.ttl). Each measured cell cites its blake3 receipt; absent
# engines render not-installed; unmeasured cells render (not measured).
# ---------------------------------------------------------------------------
[[generation.rules]]
name = "proof_table_md"
query = { file = "queries/proof_table.rq" }
template = { file = "templates/proof_table.md.tera" }
output_file = "artifacts/proof_table.md"
mode = "Overwrite"

# ---------------------------------------------------------------------------
# Rule: proof_table_json  (STATIC -> machine-readable proof table variant)
