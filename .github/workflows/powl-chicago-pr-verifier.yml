name: POWL Chicago Final Tree Verifier

on:
  pull_request:
    branches:
      - agent/powl-chicago-verifier-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: powl-chicago-final-tree-verifier
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify final rebased Chicago tree
    if: github.event.pull_request.head.ref == 'agent/cmca-chicago-jtbd-validation-v26.7.25' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cmca-chicago-jtbd-validation-v26.7.25
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Diff integrity
        run: git diff --check origin/agent/repair-post-integration-verification-ci...HEAD
      - name: POWL OCEL unit rail
        run: cargo test -p bcinr-powl --features std ocel
      - name: POWL Chicago integration
        run: cargo test -p bcinr-powl --test chicago_tdd_integration --features std
      - name: POWL all features
        run: cargo test -p bcinr-powl --all-features
      - name: POWL receipt regression
        run: cargo test -p bcinr-powl-receipt --all-features
      - name: CMCA Chicago JTBDs
        run: cargo test -p bcinr-cmca --test jtbd_certified_actuation_chicago
      - name: Workspace compile
        run: cargo check --workspace --all-features
      - name: POWL Clippy
        run: cargo clippy -p bcinr-powl --all-targets --all-features -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check
