[package]
name = "bcinr-powl"
version = "26.6.24"
edition = "2021"
description = "Partially Ordered Workflow Language runtime with branchless scheduler and cryptographic proof of execution"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/bcinr"
readme = "../../README.md"
keywords = ["workflow", "branchless", "petri", "conformance", "blake3"]
categories = ["algorithms", "data-structures"]

[dependencies]
bcinr-logic = { version = "26.6.24", path = "../bcinr-logic" }
blake3 = "1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5"

[features]
default = []
std = ["serde"]
nightly = []

[[bench]]
name = "scheduler_bench"
harness = false
