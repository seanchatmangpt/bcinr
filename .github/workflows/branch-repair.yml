name: Branch Repair

on:
  push:
    branches:
      - agent/finish-bcinr-lsp

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  repair:
    name: Normalize restored LSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-bcinr-lsp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Remove unobserved cache state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backend_path = Path("crates/bcinr-pddl-lsp/src/backend.rs")
          backend = backend_path.read_text()
          backend = backend.replace(
              "    lifecycle: lifecycle::ProjectLifecycle,\n",
              "",
          )
          backend = backend.replace(
              "                lifecycle: lc.clone(),\n",
              "",
          )
          old = '''        let (candidate, proj) = {
            let cache = self.plan_cache.lock().await;
            match cache.as_ref() {
                Some(c) => (c.candidate.clone(), c.projection.clone()),
                None => {
'''
          new = '''        let candidate = {
            let cache = self.plan_cache.lock().await;
            match cache.as_ref() {
                Some(c) => c.candidate.clone(),
                None => {
'''
          if old in backend:
              backend = backend.replace(old, new, 1)
          elif "let (candidate, proj)" in backend:
              raise SystemExit("candidate/projection block changed unexpectedly")
          backend_path.write_text(backend)

          manifest_path = Path("crates/bcinr-pddl-lsp/Cargo.toml")
          manifest = manifest_path.read_text().replace(
              "# Pin the LSP law-state runtime and ANDON layer to one admitted upstream\n"
              "# commit. This removes the former hidden dependency on ../../../lsp-max while\n"
              "# preserving exact replay across developer machines and CI runners.\n",
              "# Pin the LSP protocol/runtime to one admitted upstream commit. BCINR owns\n"
              "# lifecycle ANDON derivation locally; no external stub participates in admission.\n",
          )
          manifest_path.write_text(manifest)
          PY
      - name: Manufacture deterministic outputs
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit normalized LSP
        run: |
          if git diff --quiet -- Cargo.lock crates/bcinr-pddl-lsp; then
            echo "Restored LSP is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/bcinr-pddl-lsp
          git commit -m "fix(lsp): remove unobserved cache state"
          git push origin HEAD:agent/finish-bcinr-lsp
