name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  style:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Capture formatting diff
        id: formatting
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo fmt --all -- --check > rustfmt.patch 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat rustfmt.patch
          exit 0
      - name: Upload formatting refusal
        if: steps.formatting.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
      - name: Enforce formatting
        if: steps.formatting.outputs.status != '0'
        run: exit 1
      - name: Capture Clippy diagnostics
        id: clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings > clippy.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat clippy.log
          exit 0
      - name: Upload Clippy refusal
        if: steps.clippy.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: error
      - name: Enforce Clippy
        if: steps.clippy.outputs.status != '0'
        run: exit 1

  canonical:
    name: PDDL & POWL Canonical Conformance
    needs: [style]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Capture canonical IPC diagnostics
        id: canonical_ipc
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test -p bcinr-pddl --all-features --test canonical_ipc > canonical-ipc.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat canonical-ipc.log
          exit 0
      - name: Upload canonical IPC refusal
        if: steps.canonical_ipc.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ipc-diagnostics
          path: canonical-ipc.log
          if-no-files-found: error
      - name: Manufacture temporal-wrapper parser correction blob
        if: steps.canonical_ipc.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          path = Path("crates/bcinr-pddl/src/parse.rs")
          source = path.read_text()

          replacements = []

          replacements.append((
          '''fn parse_condition(expr: &SExpr) -> Result<PddlCondition, Pddl8Error> {
              let list = expr.list()?;
