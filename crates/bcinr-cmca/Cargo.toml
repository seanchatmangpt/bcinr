[package]
name = "bcinr-cmca"
version = "26.6.24"
edition = "2021"
description = "CMCA-RDF deterministic substrate crate"
license = "MIT OR Apache-2.0"
rust-version = "1.70"

[dependencies]
bcinr-logic = { path = "../bcinr-logic", version = "26.6.24" }

[dev-dependencies]
proptest = "1.2.0"

[features]
default = []
alloc = []
std = ["bcinr-logic/std", "alloc"]
mutant_1 = []
mutant_2 = []
mutant_3 = []
mutant_4 = []
mutant_5 = []
[lib]
crate-type = ["rlib"]
