name: Parser Correction Proof

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: parser-correction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  manufacture:
    name: Validate corrected parser blob
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Transform parser by function boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/bcinr-pddl/src/parse.rs")
          source = path.read_text()

          def block(text: str, start: str, end: str) -> tuple[int, int, str]:
              left = text.index(start)
              right = text.index(end, left)
              return left, right, text[left:right]

          condition_start, condition_end, condition = block(
              source,
              "fn parse_condition(expr: &SExpr)",
              "\nfn parse_effects(expr: &SExpr)",
          )
          condition = condition.replace(
              "    let head = list[0].atom()?;\n    match head {",
              '''    let head = list[0].atom()?;
              if list.len() == 3 && matches!(&list[2], SExpr::List(_)) {
                  let time = match (head, list[1].atom()?) {
                      ("at", "start") => Some(TimeSpecifier::AtStart),
                      ("at", "end") => Some(TimeSpecifier::AtEnd),
                      ("over", "all") => Some(TimeSpecifier::OverAll),
                      _ => None,
                  };
                  if let Some(time) = time {
                      return Ok(PddlCondition::Timed(
                          time,
                          Box::new(parse_condition(&list[2])?),
                      ));
                  }
              }
              match head {''',
              1,
          )
          temporal_start = condition.index('        "at" => {')
          temporal_end = condition.index('        "increase" | "decrease"', temporal_start)
          condition = condition[:temporal_start] + condition[temporal_end:]
          source = source[:condition_start] + condition + source[condition_end:]

          effect_start, effect_end, effect = block(
              source,
              "fn parse_effect(expr: &SExpr)",
              "\nfn parse_init(",
          )
          effect = effect.replace(
              '''    let head = list
                  .first()
                  .ok_or_else(|| Pddl8Error::ParseError("empty effect".into()))?
                  .atom()?;
              match head {''',
              '''    let head = list
                  .first()
                  .ok_or_else(|| Pddl8Error::ParseError("empty effect".into()))?
                  .atom()?;
              if list.len() == 3 && matches!(&list[2], SExpr::List(_)) {
                  let time = match (head, list[1].atom()?) {
                      ("at", "start") => Some(TimeSpecifier::AtStart),
                      ("at", "end") => Some(TimeSpecifier::AtEnd),
                      _ => None,
                  };
                  if let Some(time) = time {
                      let nested = parse_effects(&list[2])?;
                      if nested.len() != 1 {
                          return Err(Pddl8Error::ParseError(
                              "timed effect must wrap exactly one effect; put (and ...) outside each wrapper"
                                  .into(),
                          ));
                      }
                      return Ok(PddlEffect::Timed(time, Box::new(nested[0].clone())));
                  }
              }
              match head {''',
              1,
          )
          temporal_start = effect.index('        "at" => {')
          temporal_end = effect.index('        "increase" | "decrease"', temporal_start)
          effect = effect[:temporal_start] + effect[temporal_end:]
          source = source[:effect_start] + effect + source[effect_end:]

          init_start, init_end, init = block(
              source,
              "fn parse_init(",
              "\nfn parse_function(expr: &SExpr)",
          )
          init = init.replace(
              "        match list[0].atom()? {",
              '''        let head = list[0].atom()?;
                  if head == "at" && list.len() == 3 && matches!(&list[2], SExpr::List(_)) {
                      if let Ok(time) = list[1].atom()?.parse::<f64>() {
                          let literal = list[2].list()?;
                          let (negated, atom_expr) =
                              if literal.first().and_then(|v| v.atom().ok()) == Some("not") {
                                  (true, single_arg(literal, "not")?)
                              } else {
                                  (false, &list[2])
                              };
                          problem.timed_inits.push(TimedLiteral {
                              time,
                              atom: parse_atom(atom_expr)?,
                              negated,
                          });
                          continue;
                      }
                  }
                  match head {''',
              1,
          )
          temporal_start = init.index('            "at" => {')
          temporal_end = init.index('            "not" => {', temporal_start)
          init = init[:temporal_start] + init[temporal_end:]
          source = source[:init_start] + init + source[init_end:]

          test_anchor = '''    #[test]
              fn preserves_boolean_quantified_and_conditional_trees() {'''
          regression = '''    #[test]
              fn distinguishes_at_predicates_from_temporal_wrappers() {
                  let domain = domain31_from_pddl(
                      r#"(define (domain temporal-at)
                          (:requirements :strips :durative-actions)
                          (:predicates (at ?x ?l) (ready ?x))
                          (:durative-action hold
                              :parameters (?x ?l)
                              :duration (= ?duration 1)
                              :condition (and (at start (at ?x ?l)) (over all (ready ?x)))
                              :effect (at end (ready ?x))))"#,
                  )
                  .unwrap();
                  assert_eq!(domain.durative_actions.len(), 1);
                  assert!(matches!(
                      domain.durative_actions[0].conditions[0],
                      PddlCondition::Timed(TimeSpecifier::AtStart, _)
                  ));

                  let problem = problem31_from_pddl(
                      r#"(define (problem temporal-at-p)
                          (:domain temporal-at)
                          (:objects thing place)
                          (:init (at thing place) (at 2 (ready thing)))
                          (:goal (at thing place)))"#,
                  )
                  .unwrap();
                  assert_eq!(problem.init_atoms.len(), 1);
                  assert_eq!(problem.init_atoms[0].pred, "at");
                  assert_eq!(problem.timed_inits.len(), 1);
              }

              #[test]
              fn preserves_boolean_quantified_and_conditional_trees() {'''
          if source.count(test_anchor) != 1:
              raise SystemExit("parser regression insertion anchor was not unique")
          source = source.replace(test_anchor, regression, 1)

          path.write_text(source)
          PY
      - name: Format corrected parser
        run: rustfmt +nightly crates/bcinr-pddl/src/parse.rs
      - name: Parser unit proof
        run: cargo test -p bcinr-pddl --all-features --lib parse
      - name: Canonical IPC proof
        run: cargo test -p bcinr-pddl --all-features --test canonical_ipc
      - name: Create unreferenced corrected blob
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          content = Path("crates/bcinr-pddl/src/parse.rs").read_bytes()
          Path("parse-blob-request.json").write_text(json.dumps({
              "content": base64.b64encode(content).decode(),
              "encoding": "base64",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @parse-blob-request.json \
            "https://api.github.com/repos/${GH_REPOSITORY}/git/blobs" \
            > parse-corrected-blob.json
          cat parse-corrected-blob.json
      - name: Upload corrected blob identity
        uses: actions/upload-artifact@v4
        with:
          name: parse-corrected-blob-proof
          path: parse-corrected-blob.json
          if-no-files-found: error
